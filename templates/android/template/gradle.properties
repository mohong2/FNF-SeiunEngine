# Project-wide Gradle settings.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

VERSION_NAME=::META_VERSION::
VERSION_CODE=::META_BUILD_NUMBER::

ANDROID_BUILD_TARGET_SDK_VERSION=::ANDROID_TARGET_SDK_VERSION::
ANDROID_BUILD_MIN_SDK_VERSION=::ANDROID_MINIMUM_SDK_VERSION::
# compileSdk. 33 is the floor for the SDL3 Java in this template: HIDDeviceManager
# already calls Build.VERSION_CODES.TIRAMISU, Context.RECEIVER_EXPORTED and
# android.Manifest.permission.BLUETOOTH_CONNECT, so with the 30 this file used to
# carry, :app:compileReleaseJavaWithJavac fails on a clean tree.
ANDROID_BUILD_SDK_VERSION=33
ANDROID_BUILD_TOOLS_VERSION=::ANDROID_BUILD_TOOLS_VERSION::

# extension-androidtools / AndroidX dependencies require this
android.useAndroidX=true
android.enableJetifier=true

::if KEY_STORE::
KEY_STORE=::KEY_STORE::
KEY_STORE_PASSWORD=::KEY_STORE_PASSWORD::
KEY_STORE_ALIAS=::KEY_STORE_ALIAS::
KEY_STORE_ALIAS_PASSWORD=::KEY_STORE_ALIAS_PASSWORD::
::end::
