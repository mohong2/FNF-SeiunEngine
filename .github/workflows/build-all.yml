name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish mode. Default is a formal release (tag v<version>, prerelease=false).'
        required: true
        default: release
        type: choice
        options:
          - none
          - release
      custom_notes:
        description: 'Optional custom release notes (Markdown). Overrides release-notes/<version>.md; leave empty to use the version file.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

# 中国大陆镜像与加速入口；留空则不生成对应内容
env:
  MIRROR_GITEE_REPO: https://gitee.com/lmo_hongz/FNF-SeiunEngine
  MIRROR_ACCEL_BASE: https://gh.b52m.cn
  MIRROR_ACCEL_LABEL: gh.b52m.cn

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.parse.outputs.version_name }}
      commit_sha: ${{ steps.parse.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Parse version
        id: parse
        run: |
          VERSION=$(sed -n 's/.*<app[^>]*version="\([0-9][0-9A-Za-z._-]*\)".*/\1/p' Project.xml | head -n1)
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  windows:
    name: Windows x64
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  macos:
    name: macOS Build
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  android:
    name: Android Build
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  ios:
    name: iOS Device
    needs: prepare
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit

  create-release:
    name: Create Release
    needs: [prepare, linux, windows, macos, android, ios]
    if: github.event.inputs.publish != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every published build is a formal release now: tag v<version>, prerelease=false.
      - name: Resolve release metadata
        run: |
          echo "TAG_NAME=v${{ needs.prepare.outputs.version_name }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=v${{ needs.prepare.outputs.version_name }}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          echo "RELEASE_KIND=release" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          github-token: ${{ github.token }}

      - name: Package release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version_name }}
          COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::Empty version (Project.xml <app version=...>) - refusing to publish unversioned assets"
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          shopt -s nullglob

          # ONE symbols archive for the whole release. Each job uploads its own
          # *-symbols artifact (they build on different operating systems, so they
          # cannot be zipped together there); this step is where they become a single
          # download with one directory per target. No symbol file ever lands inside a
          # game zip, and the release page carries one symbols entry, not one per target.
          adds=()
          for d in release/*-symbols; do
            [ -d "$d" ] || continue
            label="${d#release/}"
            label="${label#SeiunEngine-}"
            label="${label%-symbols}"
            adds+=(--add "$label=$d")
          done
          if [ "${#adds[@]}" -gt 0 ]; then
            python3 tools/crash.py package --out "dist/SeiunEngine-symbols-${VERSION}.zip" \
              --version "$VERSION" --commit "$COMMIT" "${adds[@]}"
          else
            echo "::warning::no *-symbols artifact in this run - the release will not be debuggable"
          fi

          cd release
          for d in */; do
            d="${d%/}"
            [ -d "$d" ] || continue

            # Symbol bundles are already in the archive above; everything else is a
            # game build: APK/IPA copied out as-is, desktop targets zipped.
            case "$d" in *-symbols) continue ;; esac

            mobile=0
            for f in "$d"/*.apk "$d"/*.ipa; do
              if [ -f "$f" ]; then
                cp "$f" ../dist/
                mobile=1
              fi
            done
            if [ "$mobile" -eq 0 ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "../dist/${d}-${VERSION}.zip" "$d"
            fi
          done
          cd ../dist
          files=(*.apk *.ipa *.zip)
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          ls -la

      - name: Prepare release body
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          # Release notes priority:
          #   1. custom_notes input (workflow_dispatch) — full override
          #   2. release-notes/<version>.md — per-version file (recommended)
          #   3. generated placeholder (no more dumping the whole CHANGELOG)
          VERSION="${{ needs.prepare.outputs.version_name }}"
          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" > release_body.md
          elif [ -f "release-notes/${VERSION}.md" ]; then
            cp "release-notes/${VERSION}.md" release_body.md
          else
            cat > release_body.md <<EOF
          # SeiunEngine v$VERSION

          No per-version release notes found (\`release-notes/$VERSION.md\`).
          See \`CHANGELOG_SeiunEngine.md\` for the full changelog.
          EOF
          fi
          cat >> release_body.md <<'EOF'

          ---

          ## Build Info

          Automated ${{ env.RELEASE_KIND }} from commit `${{ needs.prepare.outputs.commit_sha }}`.

          Artifacts:
          - Linux x64
          - Windows x64
          - macOS x64
          - macOS arm64 (experimental)
          - Android (APK, armv7 + arm64)
          - iOS Device (IPA)

          ### Crash debugging symbols

          One archive - `SeiunEngine-symbols-${{ needs.prepare.outputs.version_name }}.zip` - holds the symbols of every target in
          this release: one directory per target plus a `manifest.json` naming the build each
          directory describes.

          - `windows-x64/`  `ApplicationMain.map` + `build.json` + `build-info.txt`
          - `android-arm64/`, `android-armv7/`  the unstripped `libApplicationMain*.so` + the same two files
          - `linux-x64/`, `mac-x64/`, `mac-arm64/`  `build.json` + `build-info.txt` (a gcc/clang release link writes no `.map`)

          A crash report carries `module + offset`, and an offset only means something against
          the exact link that produced that binary. Match the report's `Build:` line against
          the `build.json` of the matching directory, then check the pair before trusting a
          single frame:

              python tools/crash.py verify-map SeiunEngine.exe windows-x64/ApplicationMain.map
              python tools/crash.py resolve windows-x64/ApplicationMain.map <fault offset>

          The Windows map is verified against the published exe during the build, so a resolved
          frame is exact and not merely plausible. Symbol files are never inside the game
          packages, and a `.pdb` is never published.

          Every download carries the version, so a file taken off the release page is
          self-identifying: game builds are `SeiunEngine-<target>-<version>.<ext>` and the
          symbols are the single `SeiunEngine-symbols-<version>.zip`.

          Checksums are included in `SHA256SUMS.txt`.
          EOF

      - name: Append China mirror links
        uses: ./.github/actions/append-mirror-links
        with:
          tag: ${{ env.TAG_NAME }}
          gitee-repo: ${{ env.MIRROR_GITEE_REPO }}
          accel-base: ${{ env.MIRROR_ACCEL_BASE }}
          accel-label: ${{ env.MIRROR_ACCEL_LABEL }}

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body_path: release_body.md
          files: dist/*
