name: iOS Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  ios:
    name: iOS Device
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # The image is an input nobody versions in git: record the clang, Xcode and
      # SDK this build used, and key the object cache on it.
      - name: Record toolchain
        shell: bash
        run: python3 tools/toolchain.py

      - name: Resolve hxcpp revision
        shell: bash
        run: |
          # Hash the hxcpp ref hmm.json pins instead of a branch name written here:
          # the two drifted apart (hmm.json said haxe-4.3 while the engine needed the
          # rebased fork), and a cache keyed on a branch nothing builds is just stale.
          REF=$(python3 -c "import json;print(next(d['ref'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='hxcpp'))")
          SHA=$(git ls-remote https://github.com/mohong2/hxcpp.git "$REF" | awk '{print $1}' | head -n1)
          [ -n "$SHA" ] || SHA="$REF"
          echo "$SHA" > hxcpp-head.txt
          cat hxcpp-head.txt
          echo "hxcpp ref: $REF"

      - name: Restore hxcpp compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hxcpp-cache
          # toolchain-key.txt is the compiler. The -v4- bump is what stops
          # restore-keys from pulling a v3 cache built by the old toolset.
          key: seiu-hxcpp-ios-v4-${{ hashFiles('toolchain-key.txt', 'hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-ios-v4-

      - uses: ./.github/actions/build-ios

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeiunEngine-ios-device
          path: SeiunEngine-ios-device-${{ env.APP_VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
