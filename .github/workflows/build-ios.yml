name: iOS Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  ios:
    name: iOS Device
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Resolve hxcpp revision
        shell: bash
        run: |
          git ls-remote https://github.com/mohong2/hxcpp.git refs/heads/main | awk '{print $1}' > hxcpp-head.txt
          cat hxcpp-head.txt

      - name: Restore hxcpp compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-ios-v2-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-ios-v2-

      - uses: ./.github/actions/build-ios
        with:
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-ios-device
          path: SeiunEngine-ios-device-${{ env.APP_VERSION }}.ipa
          if-no-files-found: error
          retention-days: 14
