name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numeric build run ID (e.g. 31261975698; leave empty to use the latest Build run)'
        required: false
        type: string
      custom_notes:
        description: 'Optional custom release notes (Markdown). Overrides release-notes/<version>.md; leave empty to use the version file.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish alpha release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::run_id is not numeric ($RUN_ID), falling back to the latest Build run"
            RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow build-all.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "using build run: $RUN_ID"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9A-Za-z._-]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Package release assets
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          mkdir -p dist/crash-symbols
          cd release
          for d in */; do
            d="${d%/}"
            [ -d "$d" ] || continue

            # Crash symbol artifacts ship as separate downloads, never inside the
            # game zip (the .map alone is tens of MB and only needed for triage).
            case "$d" in
              *-symbols)
                zip -r "../dist/crash-symbols/${d}.zip" "$d"
                continue
                ;;
            esac

            mobile=0
            for f in "$d"/*.apk "$d"/*.ipa; do
              if [ -f "$f" ]; then
                cp "$f" ../dist/
                mobile=1
              fi
            done
            if [ "$mobile" -eq 0 ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "../dist/${d}.zip" "$d"
            fi
          done
          cd ../dist
          shopt -s nullglob
          if [ -z "$(ls -A crash-symbols 2>/dev/null)" ]; then
            rmdir crash-symbols 2>/dev/null || true
          fi
          files=(*.apk *.ipa *.zip)
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          ls -la
          ls -la crash-symbols 2>/dev/null || true

      - name: Prepare release body
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          # Release notes priority:
          #   1. custom_notes input (workflow_dispatch) — full override
          #   2. release-notes/<version>.md — per-version file (recommended)
          #   3. generated placeholder (no more dumping the whole CHANGELOG)
          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" > release_body.md
          elif [ -f "release-notes/${APP_VERSION}.md" ]; then
            cp "release-notes/${APP_VERSION}.md" release_body.md
          else
            cat > release_body.md <<EOF
          # SeiunEngine v$APP_VERSION

          No per-version release notes found (\`release-notes/$APP_VERSION.md\`).
          See \`CHANGELOG_SeiunEngine.md\` for the full changelog.
          EOF
          fi
          cat >> release_body.md <<'EOF'

          ---

          ## Build Info

          Automated alpha pre-release from Build workflow run ${{ env.RUN_ID }}.

          Artifacts:
          - Linux x64
          - Windows x64
          - macOS x64
          - macOS arm64 (experimental)
          - Android (APK)
          - iOS Device (IPA)

          ### Crash debugging symbols

          Published builds embed a crash linemap, so a report's backtrace carries
          `[src/File.cpp:123]` on its own - triage no longer depends on the
          developer's local build matching the user's. The files under
          `crash-symbols/` are the symbols for exactly the APK/exe in this release:

          - `SeiunEngine-windows-x64-symbols.zip`  (ApplicationMain.map + windows-x64.bin + build-info.txt)
          - `SeiunEngine-android-arm64-symbols.zip` / `SeiunEngine-android-armv7-symbols.zip`
            (unstripped libApplicationMain.so + <abi>.bin + build-info.txt)
          - `SeiunEngine-linux-x64-symbols.zip` / `SeiunEngine-mac-*-symbols.zip` (linker .map)

          Match them to the report via the report's `Build:` line and the
          `build-info.txt` of the matching zip. Offline fallback for desktop:
          `python tools/mapresolve.py ApplicationMain.map <fault offset>`.

          Checksums are included in `SHA256SUMS.txt`.
          EOF

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.APP_VERSION }}-alpha.${{ env.RUN_ID }}
          name: Alpha v${{ env.APP_VERSION }} (build ${{ env.RUN_ID }})
          prerelease: true
          body_path: release_body.md
          files: |
            dist/*
            dist/crash-symbols/*
