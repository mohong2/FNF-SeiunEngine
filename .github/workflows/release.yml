name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numeric build run ID (e.g. 31261975698; leave empty to use the latest Build run)'
        required: false
        type: string
      custom_notes:
        description: 'Optional custom release notes (Markdown). Overrides release-notes/<version>.md; leave empty to use the version file.'
        required: false
        type: string

permissions:
  contents: write

# 中国大陆镜像与加速入口；留空则不生成对应内容
env:
  MIRROR_GITEE_REPO: https://gitee.com/lmo_hongz/FNF-SeiunEngine
  MIRROR_ACCEL_BASE: https://gh.b52m.cn
  MIRROR_ACCEL_LABEL: gh.b52m.cn

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::run_id is not numeric ($RUN_ID), falling back to the latest Build run"
            RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow build-all.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "using build run: $RUN_ID"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9A-Za-z._-]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Package release assets
        run: |
          set -euo pipefail
          if [ -z "${APP_VERSION:-}" ]; then
            echo "::error::Empty APP_VERSION (Project.xml <app version=...>) - refusing to publish unversioned assets"
            exit 1
          fi
          rm -rf dist
          mkdir -p dist
          shopt -s nullglob

          # ONE symbols archive for the whole release. Each job uploads its own
          # *-symbols artifact (they build on different operating systems, so they
          # cannot be zipped together there); this step is where they become a single
          # download with one directory per target. No symbol file ever lands inside a
          # game zip, and the release page carries one symbols entry, not one per target.
          adds=()
          for d in release/*-symbols; do
            [ -d "$d" ] || continue
            label="${d#release/}"
            label="${label#SeiunEngine-}"
            label="${label%-symbols}"
            adds+=(--add "$label=$d")
          done
          if [ "${#adds[@]}" -gt 0 ]; then
            python3 tools/crash.py package --out "dist/SeiunEngine-symbols-${APP_VERSION}.zip" \
              --version "$APP_VERSION" "${adds[@]}"
          else
            echo "::warning::no *-symbols artifact in this run - the release will not be debuggable"
          fi

          cd release
          for d in */; do
            d="${d%/}"
            [ -d "$d" ] || continue

            # Symbol bundles are already in the archive above; everything else is a
            # game build: APK/IPA copied out as-is, desktop targets zipped.
            case "$d" in *-symbols) continue ;; esac

            mobile=0
            for f in "$d"/*.apk "$d"/*.ipa; do
              if [ -f "$f" ]; then
                cp "$f" ../dist/
                mobile=1
              fi
            done
            if [ "$mobile" -eq 0 ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "../dist/${d}-${APP_VERSION}.zip" "$d"
            fi
          done
          cd ../dist
          files=(*.apk *.ipa *.zip)
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          ls -la

      - name: Prepare release body
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          # Release notes priority:
          #   1. custom_notes input (workflow_dispatch) — full override
          #   2. release-notes/<version>.md — per-version file (recommended)
          #   3. generated placeholder (no more dumping the whole CHANGELOG)
          if [ -n "$CUSTOM_NOTES" ]; then
            printf '%s\n' "$CUSTOM_NOTES" > release_body.md
          elif [ -f "release-notes/${APP_VERSION}.md" ]; then
            cp "release-notes/${APP_VERSION}.md" release_body.md
          else
            cat > release_body.md <<EOF
          # SeiunEngine v$APP_VERSION

          No per-version release notes found (\`release-notes/$APP_VERSION.md\`).
          See \`CHANGELOG_SeiunEngine.md\` for the full changelog.
          EOF
          fi
          cat >> release_body.md <<'EOF'

          ---

          ## Build Info

          Automated release from Build workflow run ${{ env.RUN_ID }}.

          Artifacts:
          - Linux x64
          - Windows x64
          - macOS x64
          - macOS arm64 (experimental)
          - Android (APK)
          - iOS Device (IPA)

          ### Crash debugging symbols

          One archive - `SeiunEngine-symbols-${{ env.APP_VERSION }}.zip` - holds the symbols of every target in
          this release: one directory per target plus a `manifest.json` naming the build each
          directory describes.

          - `windows-x64/`  `ApplicationMain.map` + `build.json` + `build-info.txt`
          - `android-arm64/`, `android-armv7/`  the unstripped `libApplicationMain*.so` + the same two files
          - `linux-x64/`, `mac-x64/`, `mac-arm64/`  `SeiunEngine.sym` + `build.json` + `build-info.txt`

          A crash report carries `module + offset`, and an offset only means something against
          the exact link that produced that binary. Match the report's `Build:` line against
          the `build.json` of the matching directory, then check the pair before trusting a
          single frame:

              python tools/crash.py verify-map SeiunEngine.exe windows-x64/ApplicationMain.map
              python tools/crash.py resolve windows-x64/ApplicationMain.map <fault offset>
              python tools/crash.py sym linux-x64/SeiunEngine.sym <pc offset>

          Linux and macOS links write no `.map`, but they are not stripped either, so those
          directories carry the ELF `.symtab` / the Mach-O `LC_SYMTAB` of the binary that
          shipped, read out by `tools/symtab.py` during the build. A report from either
          platform already prints `pc <offset> <module>`, and that offset is what a `.sym`
          row is keyed on.

          Every table is verified against the published binary during the build (the map by
          `crash.py verify-map`, the tables by reading them back through `crash.py sym`), so a
          resolved frame is exact and not merely plausible. Symbol files are never inside the
          game packages, and a `.pdb` is never published.

          Every download carries the version, so a file taken off the release page is
          self-identifying: game builds are `SeiunEngine-<target>-<version>.<ext>` and the
          symbols are the single `SeiunEngine-symbols-<version>.zip`.

          Checksums are included in `SHA256SUMS.txt`.
          EOF

      - name: Append China mirror links
        uses: ./.github/actions/append-mirror-links
        with:
          tag: v${{ env.APP_VERSION }}
          gitee-repo: ${{ env.MIRROR_GITEE_REPO }}
          accel-base: ${{ env.MIRROR_ACCEL_BASE }}
          accel-label: ${{ env.MIRROR_ACCEL_LABEL }}

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          prerelease: false
          body_path: release_body.md
          files: dist/*
