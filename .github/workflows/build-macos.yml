name: macOS Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  macos:
    name: macOS Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x64
            # -64 makes lime push hxcpp's HXCPP_M64, which mac-toolchain.xml turns
            # into -arch x86_64 and the ndll/Mac64 output directory.
            rebuild: haxelib run lime rebuild mac -64 -release -Dlime-sdl3 -Dhxcpp_api_level=430
            build: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" mac -64 --app-version="$APP_VERSION-$GITHUB_RUN_ID"
            artifact: SeiunEngine-mac-x64
          - runner: macos-15-intel
            target: macos-arm64
            # An x64 host on purpose. macos-14 was retired (actions/runner-images#15226)
            # and a job naming it ended as cancelled within one second without running a
            # single step, so this leg produced nothing at all after October.
            #
            # Native Apple Silicon (macos-15) is the tempting replacement and does start
            # the build, but it dies in the first lime build:
            #   Link: ../ndll/MacArm64/lime.ndll
            #   Uncaught exception - Failed to load library : lime.ndll
            # tools/hxcpp/BuildTool.hx sends an arm64 host's ndll to ndll/MacArm64,
            # while the CFFI loader only ever inspects ndll/Mac64 (the fork's old
            # haxe-4.3 tip fixed that; the rebased base does not carry the fix).
            # Cross-compiling from an Intel host leaves the host ndll in Mac64 and works.
            # Flip this back to macos-15 once that BuildTool fix is ported.
            #
            # Both flags are required, and they do different jobs:
            #   -arm64 -> lime's ARM64 selection. The lime fork turns it into hxcpp's
            #             HXCPP_ARM64, which is what selects -arch arm64 and the
            #             ndll/MacArm64 output directory. Without it lime pushed only
            #             HXCPP_M64, so this runner quietly built an x86_64 lime.ndll
            #             in ndll/Mac64 and the build died in IconHelper with
            #             "incompatible architecture (have 'x86_64', need 'arm64')".
            #   -64    -> lime's is64 flag, which keeps the .app layout and the
            #             template context on the 64-bit paths.
            rebuild: haxelib run lime rebuild mac -arm64 -64 -release -Dlime-sdl3 -Dhxcpp_api_level=430
            build: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" mac -arm64 -64 --app-version="$APP_VERSION-$GITHUB_RUN_ID"
            artifact: SeiunEngine-mac-arm64
            experimental: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.target == 'macos-arm64' && 120 || 240 }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Resolve hxcpp revision
        shell: bash
        run: |
          # Hash the hxcpp ref hmm.json pins instead of a branch name written here:
          # the two drifted apart (hmm.json said haxe-4.3 while the engine needed the
          # rebased fork), and a cache keyed on a branch nothing builds is just stale.
          REF=$(python3 -c "import json;print(next(d['ref'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='hxcpp'))")
          SHA=$(git ls-remote https://github.com/mohong2/hxcpp.git "$REF" | awk '{print $1}' | head -n1)
          [ -n "$SHA" ] || SHA="$REF"
          echo "$SHA" > hxcpp-head.txt
          cat hxcpp-head.txt
          echo "hxcpp ref: $REF"

      - name: Restore hxcpp compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-${{ matrix.target }}-v3-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-${{ matrix.target }}-v3-

      - uses: ./.github/actions/build-desktop
        with:
          target: ${{ matrix.target }}
          rebuild: ${{ matrix.rebuild }}
          build: ${{ matrix.build }}
          artifact: ${{ matrix.artifact }}
          path: export/release/macos/bin
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: export/release/macos/bin
          if-no-files-found: error
          retention-days: 14

      # A clang release link writes no .map (and the dSYM would need an Xcode
      # archive step), so the bundle is build.json + build-info.txt: the identity of
      # the build a report is matched against. Each slice uploads its own artifact,
      # and the release folds them into one SeiunEngine-symbols-<version>.zip.
      - name: Check crash symbols
        id: symbols
        shell: bash
        run: |
          DIR=export/symbols/macos-release
          if [ -f "$DIR/build.json" ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
            cat "$DIR/build-info.txt"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no build.json in $DIR - the symbol hook (tools/SymbolsAfterBuild.hx) did not run"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.symbols.outputs.present == '1'
        with:
          name: ${{ matrix.artifact }}-symbols
          path: export/symbols/macos-release
          if-no-files-found: error
          retention-days: 90
