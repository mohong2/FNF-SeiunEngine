name: Linux Build

on:
  # The runner label is an input, not a literal, so the Toolchain Canary workflow
  # can run this same job on the *unpinned* label (ubuntu-latest) once a week and
  # report an image upgrade before a release run meets it. Everything else gets
  # the pinned default below.
  workflow_call:
    inputs:
      runner:
        description: 'Runner label. Pinned so a hosted-image upgrade cannot silently change the compiler; the canary passes ubuntu-latest.'
        required: false
        type: string
        default: ubuntu-24.04
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (default: ubuntu-24.04)'
        required: false
        type: string
        default: ubuntu-24.04

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  linux:
    name: Linux x64
    # Pinned, not "ubuntu-latest": the image alias moves (20.04 -> 22.04 -> 24.04,
    # and with it gcc and binutils) without anything in this repository changing.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # The image is an input nobody versions in git, so every job writes down the
      # compiler it actually got: toolchain.json is merged into build.json by the
      # <postbuild> hook (the shipped symbol bundle then names the toolchain of the
      # binary it describes) and toolchain-key.txt keys the object cache below, so
      # an image upgrade cannot restore gcc objects under a new gcc.
      - name: Record toolchain
        shell: bash
        run: python3 tools/toolchain.py

      - name: Resolve hxcpp revision
        shell: bash
        run: |
          # Hash the hxcpp ref hmm.json pins instead of a branch name written here:
          # the two drifted apart (hmm.json said haxe-4.3, the engine needed the
          # rebased fork), and a cache keyed on a branch nothing builds is just stale.
          REF=$(python3 -c "import json;print(next(d['ref'] for d in json.load(open('hmm.json'))['dependencies'] if d['name']=='hxcpp'))")
          SHA=$(git ls-remote https://github.com/mohong2/hxcpp.git "$REF" | awk '{print $1}' | head -n1)
          [ -n "$SHA" ] || SHA="$REF"
          echo "$SHA" > hxcpp-head.txt
          cat hxcpp-head.txt
          echo "hxcpp ref: $REF"

      - name: Restore hxcpp compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hxcpp-cache
          # toolchain-key.txt is the compiler (gcc-13.3.0-binutils-2.42, ...). The
          # -v3- bump is what stops restore-keys from pulling a v2 cache built by
          # the old toolset: a changed key alone would still fall back to it.
          key: seiu-hxcpp-linux-v3-${{ hashFiles('toolchain-key.txt', 'hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-linux-v3-

      - uses: ./.github/actions/build-desktop
        with:
          target: linux
          rebuild: haxelib run lime rebuild linux -64 -release -Dlime-sdl3 -Dhxcpp_api_level=430
          build: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" linux --app-version="$APP_VERSION-$GITHUB_RUN_ID"
          artifact: SeiunEngine-linux-x64
          path: export/release/linux/bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeiunEngine-linux-x64
          path: export/release/linux/bin
          if-no-files-found: error
          retention-days: 14

      # The bundle is build.json + build-info.txt + SeiunEngine.sym. A gcc release
      # link writes no .map, but its stripper only removes debug sections ("strip
      # -d"), so .symtab is still in the executable: tools/symtab.py read it into
      # SeiunEngine.sym during the build step, and that is what turns a report's
      # "pc <offset> <module>" into a function name. The table is a hard requirement
      # - a symbols artifact without one symbolizes nothing. Everything here lands
      # in the single SeiunEngine-symbols-<version>.zip.
      - name: Check crash symbols
        id: symbols
        shell: bash
        run: |
          DIR=export/symbols/linux-release
          missing=0
          for f in build.json build-info.txt; do
            if [ ! -s "$DIR/$f" ]; then
              echo "::error::missing crash symbol file: $DIR/$f"
              missing=1
            fi
          done
          SYM="$(ls "$DIR"/*.sym 2>/dev/null | head -n 1 || true)"
          if [ -z "$SYM" ] || [ ! -s "$SYM" ]; then
            echo "::error::$DIR holds no *.sym - tools/symtab.py did not run, or the binary carries no symbol table"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          head -n 10 "$SYM"
          grep -c '^[0-9a-f]' "$SYM" | sed 's/^/symbols: /'
          cat "$DIR/build-info.txt"
          echo "present=1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.symbols.outputs.present == '1'
        with:
          name: SeiunEngine-linux-x64-symbols
          path: export/symbols/linux-release
          if-no-files-found: error
          retention-days: 90
