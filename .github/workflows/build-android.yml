name: Android Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  android:
    name: Android
    runs-on: windows-latest
    # One lime build per ABI (the lime fork honours -arm64 / -armv7), so a job
    # compiles a single ABI (~30 minutes) instead of the old build-linemap-rebuild
    # pair; the cap keeps generous headroom for a cold hxcpp cache.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            arch: "-arm64"
          - abi: armv7
            arch: "-armv7"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Resolve hxcpp revision
        shell: pwsh
        run: |
          # Key the cache on the hxcpp ref hmm.json pins. A hardcoded branch name drifts
          # from the fork the build actually installs: that is how CI ended up on the
          # pre-rebase haxe-4.3 branch and died on _hx_std_file_seek64.
          $ref = (Get-Content -Raw hmm.json | ConvertFrom-Json).dependencies |
            Where-Object { $_.name -eq 'hxcpp' } | Select-Object -First 1 -ExpandProperty ref
          if (-not $ref) { Write-Error 'hmm.json has no hxcpp entry with a ref'; exit 1 }
          $sha = git ls-remote https://github.com/mohong2/hxcpp.git $ref |
            ForEach-Object { ($_ -split "`t")[0] } | Select-Object -First 1
          # A ref already pinned to a commit is its own identity.
          if (-not $sha) { $sha = $ref }
          $sha | Set-Content hxcpp-head.txt
          Get-Content hxcpp-head.txt
          Write-Output "hxcpp ref: $ref"

      - name: Restore hxcpp compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-android-${{ matrix.abi }}-v2-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-android-${{ matrix.abi }}-v2-

      # Both symbol builds run gradle, so its wrapper and dependency caches are
      # downloaded and configured twice per job unless they are cached here.
      - name: Restore gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: seiu-gradle-${{ matrix.abi }}-${{ hashFiles('Project.xml', 'hmm.json', 'templates/android/**') }}
          restore-keys: |
            seiu-gradle-${{ matrix.abi }}-

      - uses: ./.github/actions/build-android
        with:
          abi: ${{ matrix.abi }}
          arch: ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeiunEngine-android-${{ matrix.abi }}
          path: SeiunEngine-android-${{ matrix.abi }}-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      # The crash symbols for exactly this APK: the unstripped .so and the build
      # fingerprints a report is matched against (published separately, never
      # inside the APK). The release workflow folds this artifact into the single
      # SeiunEngine-symbols-<version>.zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeiunEngine-android-${{ matrix.abi }}-symbols
          path: export/symbols/android-release
          if-no-files-found: error
          retention-days: 90
