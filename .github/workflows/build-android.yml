name: Android Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  android:
    name: Android
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            arch: "-arm64"
          - abi: armv7
            arch: "-armv7"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Resolve hxcpp revision
        shell: pwsh
        run: |
          git ls-remote https://github.com/mohong2/hxcpp.git refs/heads/main | ForEach-Object { ($_ -split "`t")[0] } | Set-Content hxcpp-head.txt
          Get-Content hxcpp-head.txt

      - name: Restore hxcpp compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-android-${{ matrix.abi }}-v1-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-android-${{ matrix.abi }}-v1-

      - uses: ./.github/actions/build-android
        with:
          abi: ${{ matrix.abi }}
          arch: ${{ matrix.arch }}
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android-${{ matrix.abi }}
          path: SeiunEngine-android-${{ matrix.abi }}-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14

      # The crash symbols for exactly this APK: the embedded linemap, the
      # unstripped .so and the build fingerprints a report can be matched
      # against (published separately, never inside the APK).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android-${{ matrix.abi }}-symbols
          path: export/release/android/symbols
          if-no-files-found: error
          retention-days: 90
