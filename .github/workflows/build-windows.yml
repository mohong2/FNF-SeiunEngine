name: Windows Build

on:
  # The runner label is an input, not a literal, so the Toolchain Canary workflow
  # can run this same job on the *unpinned* label (windows-latest) once a week and
  # report an image upgrade before a release run meets it. Everything else gets
  # the pinned default below.
  workflow_call:
    inputs:
      runner:
        description: 'Runner label. Pinned so a hosted-image upgrade cannot silently change the compiler; the canary passes windows-latest.'
        required: false
        type: string
        default: windows-2022
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (default: windows-2022)'
        required: false
        type: string
        default: windows-2022

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  windows:
    name: Windows x64
    # windows-2022 on purpose, and pinned rather than "windows-latest".
    #
    # It is the image that carries the VS2022 toolset (MSVC 14.4x) - the same
    # compiler a developer's machine resolves to - so a C++ breakage shows up on
    # that machine first instead of only in CI. windows-2025 is not that image any
    # more: it currently resolves to win25-vs2026 (MSVC 14.5x), which is how
    # lime's openal stopped compiling with nothing in this repository changing.
    #
    # The toolset also reaches the user: hxcpp links the CRT dynamically
    # (msvc-toolchain.xml C_ABI = -MD) and no redist is shipped in the win zip, so
    # a binary built by a newer toolset asks for a newer Visual C++ runtime than
    # the 2015-2022 redist nearly every machine already has.
    #
    # Whatever the toolchain turns out to be, tools/toolchain.py records it in
    # build.json and the object cache is keyed on it, so this line moving is the
    # only way the compiler changes. The Toolchain Canary workflow runs the same
    # job on windows-latest weekly to report what the next move would land on.
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      # The image is an input nobody versions in git, so every job writes down the
      # compiler it actually got: tools/toolchain.py fills toolchain.json (merged
      # into build.json by the <postbuild> hook, so the shipped symbol bundle names
      # the toolchain of the binary it describes) and toolchain-key.txt, which the
      # object cache below is keyed on. Without that key an image upgrade keeps
      # restoring objects a different compiler produced - MSVC tolerates it, and
      # the result is a build that only misbehaves in CI.
      - name: Record toolchain
        shell: bash
        run: python tools/toolchain.py

      - name: Resolve hxcpp revision
        shell: pwsh
        run: |
          # Key the cache on the hxcpp ref hmm.json pins. A hardcoded branch name drifts
          # from the fork the build actually installs: that is how CI ended up on the
          # pre-rebase haxe-4.3 branch and died on _hx_std_file_seek64.
          $ref = (Get-Content -Raw hmm.json | ConvertFrom-Json).dependencies |
            Where-Object { $_.name -eq 'hxcpp' } | Select-Object -First 1 -ExpandProperty ref
          if (-not $ref) { Write-Error 'hmm.json has no hxcpp entry with a ref'; exit 1 }
          $sha = git ls-remote https://github.com/mohong2/hxcpp.git $ref |
            ForEach-Object { ($_ -split "`t")[0] } | Select-Object -First 1
          # A ref already pinned to a commit is its own identity.
          if (-not $sha) { $sha = $ref }
          $sha | Set-Content hxcpp-head.txt
          Get-Content hxcpp-head.txt
          Write-Output "hxcpp ref: $ref"

      - name: Restore hxcpp compile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hxcpp-cache
          # toolchain-key.txt is the compiler (msvc-14.44.35207, ...). The -v3- bump
          # is what stops restore-keys from pulling a v2 cache built by the old
          # toolset: a key change alone would still fall back to it.
          key: seiu-hxcpp-windows-v3-${{ hashFiles('toolchain-key.txt', 'hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-windows-v3-

      # One plain lime build. Project.xml wires <postbuild haxe="tools.SymbolsAfterBuild"/>,
      # which moves this link's ApplicationMain.map into export/symbols/windows-release/
      # and writes build.json + build-info.txt next to it - there is no separate
      # "symbol build" and no tools/build_windows_symbols.ps1 any more.
      - uses: ./.github/actions/build-desktop
        with:
          target: windows
          rebuild: haxelib run lime rebuild windows -64 -release -Dlime-sdl3 -Dhxcpp_api_level=430 -DLIME_VULKAN
          build: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" windows -64 --app-version="$APP_VERSION-$GITHUB_RUN_ID"
          artifact: SeiunEngine-windows-x64
          path: export/release/windows/bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeiunEngine-windows-x64
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

      # Crash symbols are published separately so they never land inside the game
      # zip users download. Attach this artifact to bug reports when triaging.
      # The release workflow folds every *-symbols artifact into ONE archive
      # (SeiunEngine-symbols-<version>.zip), so nothing here is zipped per target.
      - name: Check crash symbols
        id: symbols
        shell: bash
        run: |
          # The bundle is the only thing that can turn a user's `Fault offset` into a
          # function name, so it is a hard requirement, not a warning: a release
          # without it is a release nobody can debug. The map/exe pair was already
          # verified in the build step (crash.py verify-map); this only confirms the
          # files actually made it into the store directory that gets uploaded.
          DIR=export/symbols/windows-release
          missing=0
          for f in ApplicationMain.map build.json build-info.txt; do
            if [ -s "$DIR/$f" ]; then
              echo "ok: $f ($(stat -c%s "$DIR/$f" 2>/dev/null || wc -c < "$DIR/$f") bytes)"
            else
              echo "::error::missing crash symbol file: $DIR/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::crash symbols incomplete - refusing to publish a build that cannot be debugged"
            exit 1
          fi
          echo "present=1" >> "$GITHUB_OUTPUT"
          cat "$DIR/build-info.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.symbols.outputs.present == '1'
        with:
          name: SeiunEngine-windows-x64-symbols
          path: export/symbols/windows-release
          if-no-files-found: error
          retention-days: 90
