name: Windows Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5

      - name: Resolve hxcpp revision
        shell: pwsh
        run: |
          git ls-remote https://github.com/mohong2/hxcpp.git refs/heads/main | ForEach-Object { ($_ -split "`t")[0] } | Set-Content hxcpp-head.txt
          Get-Content hxcpp-head.txt

      - name: Restore hxcpp compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-windows-v1-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-windows-v1-

      - uses: ./.github/actions/build-desktop
        with:
          target: windows
          rebuild: haxelib run lime rebuild windows -64 -release -Dlime-sdl3
          build: |
            pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_windows_symbols.ps1 -AppVersion "$APP_VERSION-$GITHUB_RUN_ID"
          artifact: SeiunEngine-windows-x64
          path: export/release/windows/bin
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-windows-x64
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

      # Crash symbols are published separately so they never land inside the game
      # zip users download. Attach this artifact to bug reports when triaging.
      - name: Check crash symbols
        id: symbols
        shell: bash
        run: |
          # The bundle is the only thing that can turn a user's `Fault offset` into a
          # function name, so it is a hard requirement, not a warning: a release
          # without it is a release nobody can debug. The map/exe pair was already
          # verified in the build step (tools/build_windows_symbols.ps1); this only
          # confirms the three files actually made it into the artifact directory.
          DIR=export/release/windows/symbols
          missing=0
          for f in ApplicationMain.map windows-x64.bin build-info.txt; do
            if [ -s "$DIR/$f" ]; then
              echo "ok: $f ($(stat -c%s "$DIR/$f" 2>/dev/null || wc -c < "$DIR/$f") bytes)"
            else
              echo "::error::missing crash symbol file: $DIR/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::crash symbols incomplete - refusing to publish a build that cannot be debugged"
            exit 1
          fi
          echo "present=1" >> "$GITHUB_OUTPUT"
          cat "$DIR/build-info.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.symbols.outputs.present == '1'
        with:
          name: SeiunEngine-windows-x64-symbols
          path: export/release/windows/symbols
          if-no-files-found: error
          retention-days: 90
