name: Windows Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Supported toolchain: Haxe 4.3.7 (minimum 4.3.0). During the migration the same
# tree still type-checks under the 4.2.5 baseline as well; if 4.3.7 has to be
# backed out before the hxcpp fork lands, set this to "4.2.5" (one line, every
# job consumes it).
env:
  HAXE_VERSION: "4.3.7"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Resolve hxcpp revision
        shell: pwsh
        run: |
          git ls-remote https://github.com/mohong2/hxcpp.git refs/heads/main | ForEach-Object { ($_ -split "`t")[0] } | Set-Content hxcpp-head.txt
          Get-Content hxcpp-head.txt

      - name: Restore hxcpp compile cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .hxcpp-cache
          key: seiu-hxcpp-windows-v2-${{ hashFiles('hxcpp-head.txt', 'source/**/*.hx', 'assets/**/*', 'art/**/*', 'templates/**/*', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            seiu-hxcpp-windows-v2-

      # One plain lime build. Project.xml wires <postbuild haxe="tools.SymbolsAfterBuild"/>,
      # which moves this link's ApplicationMain.map into export/symbols/windows-release/
      # and writes build.json + build-info.txt next to it - there is no separate
      # "symbol build" and no tools/build_windows_symbols.ps1 any more.
      - uses: ./.github/actions/build-desktop
        with:
          target: windows
          rebuild: haxelib run lime rebuild windows -64 -release -Dlime-sdl3 -Dhxcpp_api_level=430 -DLIME_VULKAN
          build: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" windows -64 --app-version="$APP_VERSION-$GITHUB_RUN_ID"
          artifact: SeiunEngine-windows-x64
          path: export/release/windows/bin
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-windows-x64
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

      # Crash symbols are published separately so they never land inside the game
      # zip users download. Attach this artifact to bug reports when triaging.
      # The release workflow folds every *-symbols artifact into ONE archive
      # (SeiunEngine-symbols-<version>.zip), so nothing here is zipped per target.
      - name: Check crash symbols
        id: symbols
        shell: bash
        run: |
          # The bundle is the only thing that can turn a user's `Fault offset` into a
          # function name, so it is a hard requirement, not a warning: a release
          # without it is a release nobody can debug. The map/exe pair was already
          # verified in the build step (crash.py verify-map); this only confirms the
          # files actually made it into the store directory that gets uploaded.
          DIR=export/symbols/windows-release
          missing=0
          for f in ApplicationMain.map build.json build-info.txt; do
            if [ -s "$DIR/$f" ]; then
              echo "ok: $f ($(stat -c%s "$DIR/$f" 2>/dev/null || wc -c < "$DIR/$f") bytes)"
            else
              echo "::error::missing crash symbol file: $DIR/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::crash symbols incomplete - refusing to publish a build that cannot be debugged"
            exit 1
          fi
          echo "present=1" >> "$GITHUB_OUTPUT"
          cat "$DIR/build-info.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.symbols.outputs.present == '1'
        with:
          name: SeiunEngine-windows-x64-symbols
          path: export/symbols/windows-release
          if-no-files-found: error
          retention-days: 90
