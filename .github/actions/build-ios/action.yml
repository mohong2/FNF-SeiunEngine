name: Build iOS Target
description: Build the iOS app (device, arm64) - shared pipeline steps.

inputs:
  gh-pat:
    description: 'Optional GitHub PAT for private haxelib dependencies'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Every haxelib git dependency is public, so no PAT is required. The PAT path is kept for a
    # future private dep, but it must never fail the job: a stale or expired token is detected
    # here and removed again, because an invalid Authorization header would also break cloning
    # the public repos.
    - name: Auth private haxelib deps
      shell: bash
      env:
        GH_PAT: ${{ inputs.gh-pat }}
      run: |
        GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
        if [ -z "$GH_PAT" ]; then
          echo 'No GH_PAT: haxelib dependencies are public, continuing without auth.'
          exit 0
        fi
        B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
        git config --local --unset-all http.https://github.com/.extraheader || true
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
        if GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/mohong2/flixel.git HEAD >/dev/null 2>&1; then
          echo 'git auth configured (GH_PAT works)'
        else
          git config --global --unset-all http.https://github.com/.extraheader || true
          echo '::warning::GH_PAT did not authenticate; dropped it and continuing (public deps need no auth).'
        fi

    - name: Install haxelib dependencies
      shell: bash
      run: |
        haxelib setup "$GITHUB_WORKSPACE/.haxelib"
        haxe -cp ./setup -main Main --interp

    - name: Enable hxcpp compile cache
      shell: bash
      run: |
        rm -f "$HOME/.hxcpp_config.xml" "$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        cat > "$HOME/.lime/config.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <config>
          <section id="defines">
          </section>
        </config>
        EOF
        CACHE_DIR="$GITHUB_WORKSPACE/.hxcpp-cache"
        CACHE_DIR="${CACHE_DIR//\\//}"
        mkdir -p "$CACHE_DIR"
        EXAMPLE="$GITHUB_WORKSPACE/.haxelib/hxcpp/git/toolchain/example.hxcpp_config.xml"
        EXAMPLE="${EXAMPLE//\\//}"
        CONFIG="$GITHUB_WORKSPACE/.hxcpp-config.xml"
        CONFIG="${CONFIG//\\//}"
        awk -v cache="$CACHE_DIR" '/<section id="vars">/ { print; printf "  <set name=\"HXCPP_COMPILE_CACHE\" value=\"%s\" />\n", cache; print "  <set name=\"HXCPP_CACHE_MB\" value=\"4000\" />"; next } 1' "$EXAMPLE" > "$CONFIG"
        echo "HXCPP_CONFIG=$CONFIG" >> "$GITHUB_ENV"
        echo "hxcpp compile cache: $CACHE_DIR"

    - name: Patch hxcpp zlib for iOS 18 SDK
      shell: bash
      run: |
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
        ! grep -rq 'define fdopen(fd,mode) NULL' "$GITHUB_WORKSPACE/.haxelib/hxcpp"

    - name: Init discord_rpc submodules
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/.haxelib/discord_rpc/git"
        git submodule update --init --recursive

    - name: Apply iOS template patches
      shell: bash
      run: |
        LT="$GITHUB_WORKSPACE/.haxelib/lime/git/templates/ios/template"
        cp "templates/ios/template/{{app.file}}/{{app.file}}-Info.plist" "$LT/{{app.file}}/{{app.file}}-Info.plist"
        PBX="$LT/{{app.file}}.xcodeproj/project.pbxproj"
        perl -0pi -e 's/("CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "::config\.ios\.identity::";)/$1\n\tCODE_SIGNING_ALLOWED = NO;\n\tCODE_SIGNING_REQUIRED = NO;/g' "$PBX"
        grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBX"

    - name: Read app version
      shell: bash
      run: |
        # The version can carry a suffix (0.2.2preonline1), so the pattern has to accept
        # letters/underscores/dashes. The old digits-and-dots-only class matched nothing and
        # silently produced empty names such as "SeiunEngine-android-arm64-.apk".
        APP_VERSION="$(sed -n 's/.*<app[^>]*version="\([0-9][0-9A-Za-z._-]*\)".*/\1/p' Project.xml | head -n1)"
        if [ -z "$APP_VERSION" ]; then
          echo '::error::Could not read <app ... version="..."> from Project.xml'
          exit 1
        fi
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "app version: $APP_VERSION"

    - name: Configure ad-hoc iOS signing
      shell: bash
      run: |
        CONF="$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        if [ ! -f "$CONF" ]; then printf '<?xml version="1.0" encoding="utf-8"?>\n<config>\n</config>\n' > "$CONF"; fi
        sed -i '' '/<set name="ios.identity"/d' "$CONF"
        sed -i '' 's#</config>#<set name="ios.identity" value="-" /></config>#' "$CONF"
        cat "$CONF"

    - name: Rebuild Lime iOS ndll
      shell: bash
      run: haxelib run lime rebuild ios -arm64 -release

    - name: Compile iOS (device, arm64)
      shell: bash
      run: haxelib run lime build ios -arm64 --app-version="$APP_VERSION-${{ github.run_id }}"

    - name: Package IPA
      shell: bash
      run: |
        set -euo pipefail
        APP_PATH="export/release/ios/build/Release-iphoneos/SeiunEngine.app"
        if [ ! -d "$APP_PATH" ]; then
          APP_PATH="$(find export/release/ios/build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
        fi
        if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
          echo "::error::Could not find .app bundle under export/release/ios/build/Release-iphoneos"
          exit 1
        fi
        rm -rf Payload
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        ditto -c -k --sequesterRsrc --keepParent Payload "SeiunEngine-ios-device-$APP_VERSION.ipa"
        ls -lh "SeiunEngine-ios-device-$APP_VERSION.ipa"
