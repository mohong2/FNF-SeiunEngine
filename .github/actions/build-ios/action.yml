name: Build iOS Target
description: Build the iOS app (device, arm64) - shared pipeline steps.

runs:
  using: composite
  steps:
    # See build-desktop/action.yml: every haxelib dependency is public, so there is
    # no auth step any more (the stored PAT had stopped authenticating).

    - name: Install haxelib dependencies
      shell: bash
      run: |
        haxelib setup "$GITHUB_WORKSPACE/.haxelib"
        haxe -cp ./setup -main Main --interp

    # Resolve the active library directories once, so no step below hardcodes
    # .haxelib/<lib>/git - renaming the version directory must not break the build.
    - name: Resolve haxelib paths
      uses: ./.github/actions/haxelib-path
      with:
        libs: hxcpp lime discord_rpc

    # A wrong fork revision is invisible to the Haxe build and only explodes in C++, so
    # every lane checks the installed forks before it compiles anything.
    - name: Verify forked libraries
      uses: ./.github/actions/verify-forks

    - name: Enable hxcpp compile cache
      shell: bash
      run: |
        rm -f "$HOME/.hxcpp_config.xml" "$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        cat > "$HOME/.lime/config.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <config>
          <section id="defines">
          </section>
        </config>
        EOF
        CACHE_DIR="$GITHUB_WORKSPACE/.hxcpp-cache"
        CACHE_DIR="${CACHE_DIR//\\//}"
        mkdir -p "$CACHE_DIR"
        # A restored precompiled header cannot be trusted: clang bakes every header's
        # mtime into the .pch, a fresh checkout stamps those headers with today's time,
        # and hxcpp only compares the group header's hash before reusing one - so the
        # first file that has to be compiled dies with
        #   file '.../include/hx/LessThanEq.h' has been modified since the
        #   precompiled header '.../hxcpp.h.pch' was built
        # src/BuildInfo.cpp is always newest (it carries $GITHUB_RUN_ID), so this hits
        # the very first group of every run. Dropping the pch* directories costs a
        # couple of seconds per group and leaves the object cache itself alone.
        find "$CACHE_DIR" -type d -name 'pch*' -prune -print0 2>/dev/null |
          while IFS= read -r -d '' stale_pch; do rm -rf "$stale_pch"; done
        echo "dropped cached precompiled headers"
        EXAMPLE="$HAXELIB_HXCPP_PATH/toolchain/example.hxcpp_config.xml"
        EXAMPLE="${EXAMPLE//\\//}"
        # Keep the config OUT of the workspace root (see build-desktop/action.yml).
        CONFIG="$RUNNER_TEMP/.hxcpp-config.xml"
        CONFIG="${CONFIG//\\//}"
        awk -v cache="$CACHE_DIR" '/<section id="vars">/ { print; printf "  <set name=\"HXCPP_COMPILE_CACHE\" value=\"%s\" />\n", cache; print "  <set name=\"HXCPP_CACHE_MB\" value=\"4000\" />"; next } 1' "$EXAMPLE" > "$CONFIG"
        echo "HXCPP_CONFIG=$CONFIG" >> "$GITHUB_ENV"
        echo "hxcpp compile cache: $CACHE_DIR"

    - name: Patch hxcpp zlib for iOS 18 SDK
      shell: bash
      run: |
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
        ! grep -rq 'define fdopen(fd,mode) NULL' "$HAXELIB_HXCPP_PATH"

    - name: Init discord_rpc submodules
      shell: bash
      run: |
        cd "$HAXELIB_DISCORD_RPC_PATH"
        git submodule update --init --recursive

    - name: Apply iOS template patches
      shell: bash
      run: |
        LT="$HAXELIB_LIME_PATH/templates/ios/template"
        cp "templates/ios/template/{{app.file}}/{{app.file}}-Info.plist" "$LT/{{app.file}}/{{app.file}}-Info.plist"
        PBX="$LT/{{app.file}}.xcodeproj/project.pbxproj"
        perl -0pi -e 's/("CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "::config\.ios\.identity::";)/$1\n\tCODE_SIGNING_ALLOWED = NO;\n\tCODE_SIGNING_REQUIRED = NO;/g' "$PBX"
        grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBX"

    - name: Read app version
      shell: bash
      run: |
        # The version can carry a suffix (0.2.2preonline1), so the pattern has to accept
        # letters/underscores/dashes. The old digits-and-dots-only class matched nothing and
        # silently produced empty names such as "SeiunEngine-android-arm64-.apk".
        APP_VERSION="$(sed -n 's/.*<app[^>]*version="\([0-9][0-9A-Za-z._-]*\)".*/\1/p' Project.xml | head -n1)"
        if [ -z "$APP_VERSION" ]; then
          echo '::error::Could not read <app ... version="..."> from Project.xml'
          exit 1
        fi
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "app version: $APP_VERSION"

    - name: Configure ad-hoc iOS signing
      shell: bash
      run: |
        CONF="$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        if [ ! -f "$CONF" ]; then printf '<?xml version="1.0" encoding="utf-8"?>\n<config>\n</config>\n' > "$CONF"; fi
        sed -i '' '/<set name="ios.identity"/d' "$CONF"
        sed -i '' 's#</config>#<set name="ios.identity" value="-" /></config>#' "$CONF"
        cat "$CONF"

    # -Dhxcpp_api_level=430 is not passed here, and it is not what decides the iOS
    # library naming.
    #
    # One 'rebuild ios' call produces armv7 + arm64 + x86_64 simulator libraries. The
    # simulator library is liblime.iphonesim-64.a (hxcpp derives the simulator
    # architecture from the host), never the unsuffixed liblime.iphonesim.a. The build
    # then died while copying slices, because lime's update step walked i386/x86_64
    # unconditionally, fell back to liblime.iphoneos.a and aborted with:
    #   Source path ".../ndll/iPhone/liblime.iphoneos.a" does not exist
    # The lime fork now skips simulator slices unless -simulator is requested, treats
    # a slice a rebuild did not produce as a warning, and the i386 pass is opt-in
    # (Xcode 15+ no longer ships that slice).
    - name: Rebuild Lime iOS ndll
      shell: bash
      run: haxelib run lime rebuild ios -arm64 -release

    # Same reason as the desktop Compile step: an hxcpp error can leave the process
    # hanging instead of exiting. Composite steps cannot carry timeout-minutes, so the
    # bound is on the job.
    - name: Compile iOS (device, arm64)
      shell: bash
      run: haxelib run lime build "$GITHUB_WORKSPACE/Project.xml" ios -arm64 --app-version="$APP_VERSION-${{ github.run_id }}"

    - name: Package IPA
      shell: bash
      run: |
        set -euo pipefail
        APP_PATH="export/release/ios/build/Release-iphoneos/SeiunEngine.app"
        if [ ! -d "$APP_PATH" ]; then
          APP_PATH="$(find export/release/ios/build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
        fi
        if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
          echo "::error::Could not find .app bundle under export/release/ios/build/Release-iphoneos"
          exit 1
        fi
        rm -rf Payload
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        ditto -c -k --sequesterRsrc --keepParent Payload "SeiunEngine-ios-device-$APP_VERSION.ipa"
        ls -lh "SeiunEngine-ios-device-$APP_VERSION.ipa"
