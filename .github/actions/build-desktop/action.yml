name: Build Desktop Target
description: Build a single desktop target for SeiunEngine (shared pipeline steps).

inputs:
  target:
    description: 'Target id: linux, windows, macos-x64 or macos-arm64'
    required: true
  rebuild:
    description: 'Lime rebuild command'
    required: true
  build:
    description: 'Lime build command'
    required: true
  artifact:
    description: 'Artifact name'
    required: true
  path:
    description: 'Artifact path'
    required: true

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.target == 'linux'
      shell: bash
      # Only install headers actually needed for compilation. apt-get is given
      # retries/timeouts and is allowed to continue on failure to avoid stalls.
      run: |
        sudo apt-get update \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          -o Acquire::Languages=none || true
        sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev \
          libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
          libasound2-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
          libpulse-dev

    # Every haxelib git dependency is public (hmm.json pins forks of public
    # repositories), so nothing here authenticates. This step used to exist - it set
    # an Authorization header from secrets.GH_PAT - but the stored token stopped
    # authenticating and every job paid for it with a warning. A future private
    # dependency needs the header back (git config --global
    # http.https://github.com/.extraheader "AUTHORIZATION: basic <base64 of
    # x-access-token:TOKEN>") and a live PAT underneath it.
    - name: Install haxelib dependencies
      shell: bash
      run: |
        haxelib setup "$GITHUB_WORKSPACE/.haxelib"
        haxe -cp ./setup -main Main --interp

    # Resolve the active library directories once, so no step below hardcodes
    # .haxelib/<lib>/git - renaming the version directory must not break the build.
    - name: Resolve haxelib paths
      uses: ./.github/actions/haxelib-path
      with:
        # lime is resolved as well: the macOS architecture guard below inspects the
        # rebuilt ndll through HAXELIB_LIME_PATH instead of hardcoding .haxelib/<lib>/git.
        libs: hxcpp lime discord_rpc

    # A wrong fork revision is invisible to the Haxe build and only explodes in C++, so
    # every lane checks the installed forks before it compiles anything.
    - name: Verify forked libraries
      uses: ./.github/actions/verify-forks

    # The hxcpp 4.3.x forward port does not carry the 4.2.1 fork's -march=x86-64-v3
    # additions at all (they were dropped while porting), so the old
    # `sed '/-march=x86-64-v3/d'` here only ever matched nothing. It is gone:
    # mac-toolchain.xml in both the official 4.3.2 and the ported tree has zero
    # "march" hits. What remains is the arm64 tool rebuild.
    - name: Rebuild hxcpp tools for arm64
      if: inputs.target == 'macos-arm64'
      shell: bash
      run: |
        set -e
        cd "$HAXELIB_HXCPP_PATH/tools/run"
        haxe compile.hxml
        cd "$HAXELIB_HXCPP_PATH/tools/hxcpp"
        haxe compile.hxml
        echo "hxcpp tools rebuilt for arm64"

    - name: Enable hxcpp compile cache
      shell: bash
      run: |
        rm -f "$HOME/.hxcpp_config.xml" "$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        cat > "$HOME/.lime/config.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <config>
          <section id="defines">
          </section>
        </config>
        EOF
        CACHE_DIR="$GITHUB_WORKSPACE/.hxcpp-cache"
        CACHE_DIR="${CACHE_DIR//\\//}"
        mkdir -p "$CACHE_DIR"
        # A restored precompiled header cannot be trusted: clang bakes every header's
        # mtime into the .pch, a fresh checkout stamps those headers with today's time,
        # and hxcpp only compares the group header's hash before reusing one - so the
        # first file that has to be compiled dies with
        #   file '.../include/hx/LessThanEq.h' has been modified since the
        #   precompiled header '.../hxcpp.h.pch' was built
        # src/BuildInfo.cpp is always newest (it carries $GITHUB_RUN_ID), so this hits
        # the very first group of every run. Dropping the pch* directories costs a
        # couple of seconds per group and leaves the object cache itself alone.
        find "$CACHE_DIR" -type d -name 'pch*' -prune -print0 2>/dev/null |
          while IFS= read -r -d '' stale_pch; do rm -rf "$stale_pch"; done
        echo "dropped cached precompiled headers"
        EXAMPLE="$HAXELIB_HXCPP_PATH/toolchain/example.hxcpp_config.xml"
        EXAMPLE="${EXAMPLE//\\//}"
        # Keep the config OUT of the workspace root: lime's project auto-detection scans *.xml
        # in the working directory, and a second xml sitting next to Project.xml can hijack it
        # (lime then reports 'You must have a "project.xml" file'). RUNNER_TEMP is outside the repo.
        CONFIG="$RUNNER_TEMP/.hxcpp-config.xml"
        CONFIG="${CONFIG//\\//}"
        awk -v cache="$CACHE_DIR" '/<section id="vars">/ { print; printf "  <set name=\"HXCPP_COMPILE_CACHE\" value=\"%s\" />\n", cache; print "  <set name=\"HXCPP_CACHE_MB\" value=\"4000\" />"; next } 1' "$EXAMPLE" > "$CONFIG"
        echo "HXCPP_CONFIG=$CONFIG" >> "$GITHUB_ENV"
        echo "hxcpp compile cache: $CACHE_DIR"

    - name: Init discord_rpc submodules
      shell: bash
      run: |
        cd "$HAXELIB_DISCORD_RPC_PATH"
        git submodule update --init --recursive

    - name: Patch hxcpp zlib for modern macOS SDK
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
        ! grep -rq 'define fdopen(fd,mode) NULL' "$HAXELIB_HXCPP_PATH"

    - name: Silence unused -stdlib=libc++ warning on macOS
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$HAXELIB_HXCPP_PATH" -path '*/toolchain/mac-toolchain.xml' \
          -exec perl -0pi -e 's{(<flag value="-stdlib=libc\+\+" unless="STDLIBCPP" />)}{$1\n  <flag value="-Wno-unused-command-line-argument" if="HXCPP_CLANG" />}' {} +
        find "$HAXELIB_HXCPP_PATH" -path '*/toolchain/mac-toolchain.xml' -exec grep -q 'Wno-unused-command-line-argument' {} \;

    # The x86 SIMD exclusions for arm64 now live in the lime fork, not in CI:
    # project/lib/pixman and project/lib/openal gate their SSE/MMX sources, their -m*
    # flags and config-macos-arm64.h on HXCPP_ARM64. Patching the libraries from CI
    # hid the piece that actually mattered - pixman's config.h kept #define-ing
    # USE_SSE2 for HX_MACOS, so pixman-x86.o still referenced
    # _pixman_implementation_create_sse2 after the step had deleted the only source
    # that defines it, and the arm64 link failed on an undefined symbol.
    - name: Read app version
      shell: bash
      run: |
        # The version can carry a suffix (0.2.2preonline1), so the pattern has to accept
        # letters/underscores/dashes. The old digits-and-dots-only class matched nothing and
        # silently produced empty names such as "SeiunEngine-android-arm64-.apk".
        APP_VERSION="$(sed -n 's/.*<app[^>]*version="\([0-9][0-9A-Za-z._-]*\)".*/\1/p' Project.xml | head -n1)"
        if [ -z "$APP_VERSION" ]; then
          echo '::error::Could not read <app ... version="..."> from Project.xml'
          exit 1
        fi
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "app version: $APP_VERSION"

    - name: Rebuild Lime ndll (SDL3)
      shell: bash
      run: ${{ inputs.rebuild }}

    # A compile error is not always fatal to the process: on macOS the 2026-11-15 run
    # printed "compile failed: src/BuildInfo.cpp" and then sat there for four hours
    # until the job timeout. A step cannot be bounded here - composite actions reject
    # timeout-minutes ("Unexpected value 'timeout-minutes'") - so the bound sits on the
    # job in each workflow.
    - name: Compile
      shell: bash
      run: ${{ inputs.build }}

    # Linux and macOS links write no .map and no dSYM, but their release stripper
    # is narrow (gcc-toolchain.xml, shared by both): "strip -d" on Linux removes
    # debugging sections and leaves the ELF .symtab, and "strip -u -r -x" on macOS
    # drops local symbols only. So the shipped binary still carries the table a
    # report needs. Read it out now, while build.json names exactly that binary:
    # without this the bundle can only say WHICH build crashed, never WHERE.
    - name: Extract the symbol table
      if: inputs.target == 'linux' || startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          linux)                 PLAT=linux ;;
          macos-x64|macos-arm64) PLAT=macos ;;
          *) exit 0 ;;
        esac
        # --binary is deliberately not passed: symtab.py takes the path out of the
        # build.json the <postbuild> hook just wrote, so the table can only describe
        # the binary the manifest names - a mismatch is an error, not a wrong name in
        # somebody's crash report.
        #
        # --min-symbols 1000 is the guard that matters on macOS: the shipped .app is
        # built with -fvisibility=hidden and stripped of its local symbols, so reading
        # IT would "succeed" with ~150 exported names - a table that resolves almost
        # nothing. A real table has tens of thousands; anything below this floor means
        # the pre-strip copy was not there and the run must not pretend otherwise.
        # Say what the link actually left behind when this is about to fail: the first
        # macOS attempt reported only "no pre-strip copy" with nothing to look at.
        ls -la "export/release/$PLAT/obj" 2>/dev/null | head -n 12 || true
        find . -maxdepth 5 -name '*.unstripped' -print 2>/dev/null | head -n 5 || true
        python3 tools/symtab.py --platform "$PLAT" --out "export/symbols/$PLAT-release" --min-symbols 1000

    - name: Verify crash symbols
      shell: bash
      # tools/SymbolsAfterBuild.hx (the <postbuild> hook in Project.xml) has already
      # written build.json + build-info.txt into export/symbols/<platform>-release/
      # and moved this link's map into it; the step above added the ELF/Mach-O table.
      # Nothing is collected here: this only proves the bundle can resolve a report
      # from the binary that is about to ship. The bundle is published as its own
      # download - never inside the game zip - and a PDB is never published (a
      # release link does not even produce one).
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          windows)               PLAT=windows; EXE="export/release/windows/bin/SeiunEngine.exe" ;;
          linux)                 PLAT=linux;   EXE="export/release/linux/bin/SeiunEngine" ;;
          macos-x64|macos-arm64) PLAT=macos;   EXE="" ;;
          *) echo "::error::unknown target $TARGET - cannot look up its symbols"; exit 1 ;;
        esac
        DIR="export/symbols/$PLAT-release"

        # The hook is the only writer of the manifest, so a missing one means it did
        # not run - and a build nobody can symbolize is not publishable on any target.
        if [ ! -f "$DIR/build.json" ]; then
          echo "::error::$DIR has no build.json - the symbol hook (tools/SymbolsAfterBuild.hx) did not run"
          ls -la export/symbols 2>/dev/null || true
          exit 1
        fi
        cat "$DIR/build-info.txt"

        # Every artifact names the compiler that built it (the "Record toolchain"
        # step in each workflow). A manifest without that block means the step
        # stopped running before the build, and a bundle that cannot say which
        # toolchain produced the binary is exactly what this pipeline exists to
        # avoid: the CI image and a developer's machine are on different MSVC
        # releases right now, so "which compiler" is a real question about a crash
        # report, not trivia.
        if ! grep -q '"toolchain"' "$DIR/build.json"; then
          echo "::error::$DIR/build.json carries no toolchain block - tools/toolchain.py did not run before the build"
          exit 1
        fi

        if [ "$PLAT" = "windows" ]; then
          MAP="$DIR/ApplicationMain.map"
          if [ ! -f "$MAP" ]; then
            echo "::error::$MAP is missing - crash reports could not be symbolized"
            exit 1
          fi
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE is missing - cannot check the crash symbols against it"
            exit 1
          fi
          if ! python tools/crash.py verify-map "$EXE" "$MAP" --quiet; then
            python tools/crash.py verify-map "$EXE" "$MAP" || true
            echo "::error::the published ApplicationMain.map does not belong to the published exe"
            exit 1
          fi
          echo "crash symbols verified: $MAP describes $EXE"
        else
          SYM="$(ls "$DIR"/*.sym 2>/dev/null | head -n 1 || true)"
          if [ -z "$SYM" ] || [ ! -s "$SYM" ]; then
            echo "::error::$DIR holds no *.sym - a report from this build could only be matched, never resolved"
            exit 1
          fi
          COUNT="$(grep -c '^[0-9a-f]' "$SYM" || true)"
          if [ "${COUNT:-0}" -lt 100 ]; then
            echo "::error::$SYM holds ${COUNT:-0} symbols - too few to resolve a real report"
            exit 1
          fi
          # Read it back the way a user would: a table crash.py cannot parse is not
          # a published symbol file, no matter how many lines it has.
          FIRST="$(grep -m 1 '^[0-9a-f]' "$SYM" | cut -d' ' -f1)"
          python3 tools/crash.py sym "$SYM" "0x$FIRST" --quiet | tail -n 1
          echo "crash symbols verified: $SYM ($COUNT symbols) describes the shipped binary"
        fi
        du -sh "$DIR" || true
        ls -la "$DIR"

    # A macOS build that ships the wrong slice is worse than a red build: it looks
    # green until something dlopen()s it. The arm64 rebuild produces two ndlls -
    # ndll/Mac64 (x86_64, the copy hxcpp builds for the host tools) and ndll/MacArm64
    # (arm64, the target) - and lime used to package the former, so the .app carried an
    # x86_64 lime.ndll beside an arm64 executable and only a real Apple Silicon machine
    # noticed. Verify the source ndll the target was built into, and the one that ended
    # up inside the .app.
    - name: Verify macOS build architecture
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          macos-arm64) WANT="arm64";  NDLL_DIR="MacArm64" ;;
          macos-x64)   WANT="x86_64"; NDLL_DIR="Mac64" ;;
          *) echo "::error::unknown macOS target $TARGET - cannot verify architecture"; exit 1 ;;
        esac
        echo "verifying $TARGET -> expect $WANT"

        # lipo prints a Mach-O's architectures (and handles fat binaries).
        check() {
          local label="$1" path="$2"
          if [ ! -f "$path" ]; then
            echo "::error::$label missing: $path"
            return 1
          fi
          local archs
          archs="$(lipo -archs "$path" 2>/dev/null || true)"
          if [ -z "$archs" ]; then
            echo "::error::$label is not a Mach-O or lipo failed: $path"
            return 1
          fi
          echo "$label: $archs"
          if ! printf "%s\n" "$archs" | tr " " "\n" | grep -qx "$WANT"; then
            echo "::error::$label is $archs, expected $WANT - the build produced the wrong architecture"
            return 1
          fi
        }

        fail=0

        # The ndll this target was rebuilt into. It is deliberately not a loop over
        # every macOS ndll directory: ndll/Mac64 holds the host tools' x86_64 copy and
        # ndll/Mac still holds a 32-bit one, neither of which says anything about the
        # architecture of the build being packaged.
        check "lime.ndll ($NDLL_DIR)" "$HAXELIB_LIME_PATH/ndll/$NDLL_DIR/lime.ndll" || fail=1

        APP="$(find export/release/macos/bin -maxdepth 2 -name '*.app' | head -n1 || true)"
        if [ -z "$APP" ]; then
          echo "::error::no .app bundle under export/release/macos/bin - cannot verify the architecture"
          fail=1
        else
          EXE="$APP/Contents/MacOS/SeiunEngine"
          if [ ! -f "$EXE" ]; then EXE="$(find "$APP/Contents/MacOS" -type f | head -n1 || true)"; fi
          if [ -z "$EXE" ]; then
            echo "::error::no executable inside $APP/Contents/MacOS - cannot verify the architecture"
            fail=1
          else
            check "SeiunEngine binary" "$EXE" || fail=1
          fi
          INAPP="$(find "$APP" -name 'lime.ndll' | head -n1 || true)"
          if [ -z "$INAPP" ]; then
            echo "::error::the .app does not contain lime.ndll - it cannot start"
            fail=1
          else
            check "lime.ndll (in .app)" "$INAPP" || fail=1
          fi
        fi

        if [ "$fail" -ne 0 ]; then
          echo "::error::macOS $TARGET architecture verification failed"
          exit 1
        fi
        echo "architecture verified: $TARGET is $WANT"
    - name: Ad-hoc codesign macOS app
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        # lime produces an unsigned .app; macOS (especially Apple Silicon)
        # refuses to run unsigned/mis-signed bundles ("damaged" / killed).
        # Ad-hoc signing makes the app launchable (right-click -> Open on the
        # first run). Real Developer ID + notarization would need Apple certs.
        APP="$(find export/release/macos/bin -maxdepth 2 -name '*.app' | head -n1)"
        if [ -n "$APP" ]; then
          echo "Signing: $APP"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict -v "$APP"
          echo "Ad-hoc signing OK"
        else
          echo "::warning::No .app bundle found in export/release/macos/bin - skipping codesign"
        fi
