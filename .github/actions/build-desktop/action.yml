name: Build Desktop Target
description: Build a single desktop target for SeiunEngine (shared pipeline steps).

inputs:
  target:
    description: 'Target id: linux, windows, macos-x64 or macos-arm64'
    required: true
  rebuild:
    description: 'Lime rebuild command'
    required: true
  build:
    description: 'Lime build command'
    required: true
  artifact:
    description: 'Artifact name'
    required: true
  path:
    description: 'Artifact path'
    required: true
  gh-pat:
    description: 'Optional GitHub PAT for private haxelib dependencies'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.target == 'linux'
      shell: bash
      # Only install headers actually needed for compilation. apt-get is given
      # retries/timeouts and is allowed to continue on failure to avoid stalls.
      run: |
        sudo apt-get update \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          -o Acquire::Languages=none || true
        sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev \
          libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
          libasound2-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
          libpulse-dev

    # Every haxelib git dependency is public, so no PAT is required. The PAT path is kept for a
    # future private dep, but it must never fail the job: a stale or expired token is detected
    # here and removed again, because an invalid Authorization header would also break cloning
    # the public repos.
    - name: Auth private haxelib deps
      shell: bash
      env:
        GH_PAT: ${{ inputs.gh-pat }}
      run: |
        GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
        if [ -z "$GH_PAT" ]; then
          echo 'No GH_PAT: haxelib dependencies are public, continuing without auth.'
          exit 0
        fi
        B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
        git config --local --unset-all http.https://github.com/.extraheader || true
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
        if GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/mohong2/flixel.git HEAD >/dev/null 2>&1; then
          echo 'git auth configured (GH_PAT works)'
        else
          git config --global --unset-all http.https://github.com/.extraheader || true
          echo '::warning::GH_PAT did not authenticate; dropped it and continuing (public deps need no auth).'
        fi

    - name: Install haxelib dependencies
      shell: bash
      run: |
        haxelib setup "$GITHUB_WORKSPACE/.haxelib"
        haxe -cp ./setup -main Main --interp

    # Resolve the active library directories once, so no step below hardcodes
    # .haxelib/<lib>/git - renaming the version directory must not break the build.
    - name: Resolve haxelib paths
      uses: ./.github/actions/haxelib-path
      with:
        # lime is resolved as well: the macOS architecture guard below inspects the
        # rebuilt ndll through HAXELIB_LIME_PATH instead of hardcoding .haxelib/<lib>/git.
        libs: hxcpp lime discord_rpc

    # The hxcpp 4.3.x forward port does not carry the 4.2.1 fork's -march=x86-64-v3
    # additions at all (they were dropped while porting), so the old
    # `sed '/-march=x86-64-v3/d'` here only ever matched nothing. It is gone:
    # mac-toolchain.xml in both the official 4.3.2 and the ported tree has zero
    # "march" hits. What remains is the arm64 tool rebuild.
    - name: Rebuild hxcpp tools for arm64
      if: inputs.target == 'macos-arm64'
      shell: bash
      run: |
        set -e
        cd "$HAXELIB_HXCPP_PATH/tools/run"
        haxe compile.hxml
        cd "$HAXELIB_HXCPP_PATH/tools/hxcpp"
        haxe compile.hxml
        echo "hxcpp tools rebuilt for arm64"

    - name: Enable hxcpp compile cache
      shell: bash
      run: |
        rm -f "$HOME/.hxcpp_config.xml" "$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        cat > "$HOME/.lime/config.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <config>
          <section id="defines">
          </section>
        </config>
        EOF
        CACHE_DIR="$GITHUB_WORKSPACE/.hxcpp-cache"
        CACHE_DIR="${CACHE_DIR//\\//}"
        mkdir -p "$CACHE_DIR"
        EXAMPLE="$HAXELIB_HXCPP_PATH/toolchain/example.hxcpp_config.xml"
        EXAMPLE="${EXAMPLE//\\//}"
        # Keep the config OUT of the workspace root: lime's project auto-detection scans *.xml
        # in the working directory, and a second xml sitting next to Project.xml can hijack it
        # (lime then reports 'You must have a "project.xml" file'). RUNNER_TEMP is outside the repo.
        CONFIG="$RUNNER_TEMP/.hxcpp-config.xml"
        CONFIG="${CONFIG//\\//}"
        awk -v cache="$CACHE_DIR" '/<section id="vars">/ { print; printf "  <set name=\"HXCPP_COMPILE_CACHE\" value=\"%s\" />\n", cache; print "  <set name=\"HXCPP_CACHE_MB\" value=\"4000\" />"; next } 1' "$EXAMPLE" > "$CONFIG"
        echo "HXCPP_CONFIG=$CONFIG" >> "$GITHUB_ENV"
        echo "hxcpp compile cache: $CACHE_DIR"

    - name: Init discord_rpc submodules
      shell: bash
      run: |
        cd "$HAXELIB_DISCORD_RPC_PATH"
        git submodule update --init --recursive

    - name: Patch hxcpp zlib for modern macOS SDK
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
        find "$HAXELIB_HXCPP_PATH" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
        ! grep -rq 'define fdopen(fd,mode) NULL' "$HAXELIB_HXCPP_PATH"

    - name: Silence unused -stdlib=libc++ warning on macOS
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$HAXELIB_HXCPP_PATH" -path '*/toolchain/mac-toolchain.xml' \
          -exec perl -0pi -e 's{(<flag value="-stdlib=libc\+\+" unless="STDLIBCPP" />)}{$1\n  <flag value="-Wno-unused-command-line-argument" if="HXCPP_CLANG" />}' {} +
        find "$HAXELIB_HXCPP_PATH" -path '*/toolchain/mac-toolchain.xml' -exec grep -q 'Wno-unused-command-line-argument' {} \;

    # The x86 SIMD exclusions for arm64 now live in the lime fork, not in CI:
    # project/lib/pixman and project/lib/openal gate their SSE/MMX sources, their -m*
    # flags and config-macos-arm64.h on HXCPP_ARM64. Patching the libraries from CI
    # hid the piece that actually mattered - pixman's config.h kept #define-ing
    # USE_SSE2 for HX_MACOS, so pixman-x86.o still referenced
    # _pixman_implementation_create_sse2 after the step had deleted the only source
    # that defines it, and the arm64 link failed on an undefined symbol.
    - name: Read app version
      shell: bash
      run: |
        # The version can carry a suffix (0.2.2preonline1), so the pattern has to accept
        # letters/underscores/dashes. The old digits-and-dots-only class matched nothing and
        # silently produced empty names such as "SeiunEngine-android-arm64-.apk".
        APP_VERSION="$(sed -n 's/.*<app[^>]*version="\([0-9][0-9A-Za-z._-]*\)".*/\1/p' Project.xml | head -n1)"
        if [ -z "$APP_VERSION" ]; then
          echo '::error::Could not read <app ... version="..."> from Project.xml'
          exit 1
        fi
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "app version: $APP_VERSION"

    - name: Rebuild Lime ndll (SDL3)
      shell: bash
      run: ${{ inputs.rebuild }}

    - name: Compile
      shell: bash
      run: ${{ inputs.build }}

    - name: Collect crash symbols
      shell: bash
      # Windows already ships a matching symbol bundle from
      # tools/build_windows_symbols.ps1 (embedded crash linemap + .map +
      # build-info.txt). This step only fills the gap for the targets that have
      # none yet: it copies the linker .map, which maps every function's exact
      # RVA so a report's "Fault offset" still resolves offline.
      # The .map is a separate download - never inside the game package - and a
      # PDB is never published.
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          windows) OUT="export/release/windows" ;;
          linux)   OUT="export/release/linux" ;;
          *)       OUT="export/release/macos" ;;
        esac

        mkdir -p "$OUT/symbols"
        found=0
        # Only the .map: with HXCPP_DEBUG_LINK off the linker never runs /DEBUG,
        # so no PDB is regenerated and whatever .pdb sits in obj/ belongs to some
        # older build. Shipping it would actively mislead - resolve against the map.
        if [ "$TARGET" = "windows" ]; then
          # tools/build_windows_symbols.ps1 already wrote this bundle, and it holds
          # the map of the link that produced bin/SeiunEngine.exe. Re-collecting the
          # newest map from obj/ is exactly how a release ends up publishing symbols
          # for a binary nobody has, so verify the pair that is about to be
          # published instead of guessing.
          EXE="$OUT/bin/SeiunEngine.exe"
          MAP="$OUT/symbols/ApplicationMain.map"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE is missing - cannot check the crash symbols against it"
            exit 1
          fi
          if [ ! -f "$MAP" ]; then
            echo "::error::$MAP is missing - crash reports would not be symbolizable"
            exit 1
          fi
          if ! python tools/verify_map.py "$EXE" "$MAP" --quiet; then
            python tools/verify_map.py "$EXE" "$MAP" || true
            echo "::error::the published ApplicationMain.map does not belong to the published exe"
            exit 1
          fi
          echo "crash symbols verified: $MAP describes $EXE"
          found=1
        else
          for f in "$OUT"/obj/ApplicationMain.map; do
            if [ -e "$f" ]; then
              cp -R "$f" "$OUT/symbols/"
              found=1
              echo "collected: $f"
            fi
          done
        fi

        if [ "$found" -eq 0 ]; then
          echo "::warning::No symbol files found for $TARGET - crash reports will not be symbolizable"
          exit 0
        fi

        # Shim so `python tools/mapresolve.py <map> <offset>` works with the
        # published layout (the CI collector is named after the target).
        if [ -f "$OUT/symbols/ApplicationMain.map" ]; then
          cat > "$OUT/symbols/README.txt" <<'EOF'
        SeiunEngine crash symbol files
        ==============================

        These files map a crash report's "Fault offset" back to a real function.

        Windows builds additionally ship windows-x64.bin (the crash linemap that is
        embedded in the published exe) and build-info.txt - see
        tools/build_windows_symbols.ps1. With those, the backtrace inside the report
        already carries cpp file:line, and the .map below is only a fallback.

        How to use
        ----------
        1. Get crash/native_crash_*.txt from the affected user.
        2. Confirm the map belongs to this build - it is checked automatically at
           release time, and you can re-check any pair yourself:

             python tools/verify_map.py SeiunEngine.exe ApplicationMain.map

           It compares the map's recorded Timestamp and image base with the exe's
           PE header and the .text extent of both. A mismatch means every frame
           would resolve to the wrong function - get the right bundle instead.
        3. Resolve the offsets (the report may contain several, from the backtrace):

             python tools/mapresolve.py ApplicationMain.map 0x1340289 0x133429A

           or point it straight at a crash directory:

             python tools/mapresolve.py --crash-dir <crash dir> ApplicationMain.map

        4. Read the nearest preceding function and the +0x offset. Frames whose
           offset is implausibly large (hundreds of KB) are not reliable: release
           builds do not list every function in the map.

        The native "Symbols:" line in the report refers to dbghelp pairing the exe
        with a PDB; release builds do not ship one, so it says SymType=0. That is
        expected and no longer matters: the [file:line] annotations come from the
        embedded linemap. Use the .map only for frames the linemap does not cover.

        A real .pdb is intentionally NEVER published (it is ~50 MB). The linemap is
        generated from a PDB during the build (tools/build_windows_symbols.ps1,
        tools/gen_linemap_msvc.py) and that PDB stays in obj/ - the published exe
        carries the compressed address->line table instead.
        EOF
          echo "wrote $OUT/symbols/README.txt"
        fi

        du -sh "$OUT/symbols" || true
        ls -la "$OUT/symbols"

    # A macOS build that ships the wrong slice is worse than a red build: it looks
    # green until something dlopen()s it. IconHelper loads lime.ndll to rasterize the
    # .icns, so a wrong-architecture ndll kills the build in IconHelper with
    # "incompatible architecture". The cause was lime never passing HXCPP_ARM64 (only
    # HXCPP_M64), which pinned hxcpp to "-arch x86_64" and ndll/Mac64; the lime fork
    # now selects ndll/MacArm64 for -arm64. Verify the built artifacts really are the
    # target architecture before packaging.
    - name: Verify macOS build architecture
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          macos-arm64) WANT="arm64" ;;
          macos-x64)   WANT="x86_64" ;;
          *) echo "::error::unknown macOS target $TARGET - cannot verify architecture"; exit 1 ;;
        esac
        echo "verifying $TARGET -> expect $WANT"

        # lipo prints a Mach-O's architectures (and handles fat binaries).
        check() {
          local label="$1" path="$2"
          if [ ! -f "$path" ]; then
            echo "::error::$label missing: $path"
            return 1
          fi
          local archs
          archs="$(lipo -archs "$path" 2>/dev/null || true)"
          if [ -z "$archs" ]; then
            echo "::error::$label is not a Mach-O or lipo failed: $path"
            return 1
          fi
          echo "$label: $archs"
          if ! printf "%s\n" "$archs" | tr " " "\n" | grep -qx "$WANT"; then
            echo "::error::$label is $archs, expected $WANT - the build produced the wrong architecture"
            return 1
          fi
        }

        fail=0

        # The ndll lime just rebuilt: what the .app ships, and what IconHelper
        # dlopens during the icon step.
        for ndll in "$HAXELIB_LIME_PATH"/ndll/MacArm64/lime.ndll "$HAXELIB_LIME_PATH"/ndll/Mac64/lime.ndll "$HAXELIB_LIME_PATH"/ndll/Mac/lime.ndll; do
          if [ -f "$ndll" ]; then check "lime.ndll ($(basename "$(dirname "$ndll")"))" "$ndll" || fail=1; fi
        done

        APP="$(find export/release/macos/bin -maxdepth 2 -name '*.app' | head -n1 || true)"
        if [ -z "$APP" ]; then
          echo "::error::no .app bundle under export/release/macos/bin - cannot verify the architecture"
          fail=1
        else
          EXE="$APP/Contents/MacOS/SeiunEngine"
          if [ ! -f "$EXE" ]; then EXE="$(find "$APP/Contents/MacOS" -type f | head -n1 || true)"; fi
          if [ -z "$EXE" ]; then
            echo "::error::no executable inside $APP/Contents/MacOS - cannot verify the architecture"
            fail=1
          else
            check "SeiunEngine binary" "$EXE" || fail=1
          fi
          INAPP="$(find "$APP" -name 'lime.ndll' | head -n1 || true)"
          if [ -n "$INAPP" ]; then check "lime.ndll (in .app)" "$INAPP" || fail=1; fi
        fi

        if [ "$fail" -ne 0 ]; then
          echo "::error::macOS $TARGET architecture verification failed"
          exit 1
        fi
        echo "architecture verified: $TARGET is $WANT"
    - name: Ad-hoc codesign macOS app
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        # lime produces an unsigned .app; macOS (especially Apple Silicon)
        # refuses to run unsigned/mis-signed bundles ("damaged" / killed).
        # Ad-hoc signing makes the app launchable (right-click -> Open on the
        # first run). Real Developer ID + notarization would need Apple certs.
        APP="$(find export/release/macos/bin -maxdepth 2 -name '*.app' | head -n1)"
        if [ -n "$APP" ]; then
          echo "Signing: $APP"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict -v "$APP"
          echo "Ad-hoc signing OK"
        else
          echo "::warning::No .app bundle found in export/release/macos/bin - skipping codesign"
        fi
