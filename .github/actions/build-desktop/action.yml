name: Build Desktop Target
description: Build a single desktop target for SeiunEngine (shared pipeline steps).

inputs:
  target:
    description: 'Target id: linux, windows, macos-x64 or macos-arm64'
    required: true
  rebuild:
    description: 'Lime rebuild command'
    required: true
  build:
    description: 'Lime build command'
    required: true
  artifact:
    description: 'Artifact name'
    required: true
  path:
    description: 'Artifact path'
    required: true
  gh-pat:
    description: 'Optional GitHub PAT for private haxelib dependencies'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.target == 'linux'
      shell: bash
      # Only install headers actually needed for compilation. apt-get is given
      # retries/timeouts and is allowed to continue on failure to avoid stalls.
      run: |
        sudo apt-get update \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          -o Acquire::Languages=none || true
        sudo apt-get install -y --no-install-recommends libvlc-dev libvlccore-dev \
          libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
          libasound2-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
          libpulse-dev

    - name: Auth private haxelib deps
      shell: bash
      run: |
        GH_PAT="${{ inputs.gh-pat }}"
        GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
        if [ -n "$GH_PAT" ]; then
          B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
          git ls-remote https://github.com/mohong2/flixel.git HEAD
        else
          echo '::warning::GH_PAT not set - private deps will fail'
        fi

    - name: Install haxelib dependencies
      shell: bash
      run: |
        haxelib setup "$GITHUB_WORKSPACE/.haxelib"
        haxe -cp ./setup -main Main --interp

    - name: Patch hxcpp mac toolchain for arm64
      if: inputs.target == 'macos-arm64'
      shell: bash
      run: |
        set -e
        MAC_TOOLCHAIN="$GITHUB_WORKSPACE/.haxelib/hxcpp/git/toolchain/mac-toolchain.xml"
        sed -i.bak '/-march=x86-64-v3/d' "$MAC_TOOLCHAIN"
        rm -f "$MAC_TOOLCHAIN.bak"
        if grep -q 'march=x86-64-v3' "$MAC_TOOLCHAIN"; then
          echo "warning: march=x86-64-v3 still present in mac-toolchain.xml"
        else
          echo "removed march=x86-64-v3 from mac-toolchain.xml"
        fi
        cd "$GITHUB_WORKSPACE/.haxelib/hxcpp/git/tools/run"
        haxe compile.hxml
        cd "$GITHUB_WORKSPACE/.haxelib/hxcpp/git/tools/hxcpp"
        haxe compile.hxml
        echo "hxcpp tools rebuilt for arm64"

    - name: Enable hxcpp compile cache
      shell: bash
      run: |
        rm -f "$HOME/.hxcpp_config.xml" "$HOME/.lime/config.xml"
        mkdir -p "$HOME/.lime"
        cat > "$HOME/.lime/config.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <config>
          <section id="defines">
          </section>
        </config>
        EOF
        CACHE_DIR="$GITHUB_WORKSPACE/.hxcpp-cache"
        CACHE_DIR="${CACHE_DIR//\\//}"
        mkdir -p "$CACHE_DIR"
        EXAMPLE="$GITHUB_WORKSPACE/.haxelib/hxcpp/git/toolchain/example.hxcpp_config.xml"
        EXAMPLE="${EXAMPLE//\\//}"
        CONFIG="$GITHUB_WORKSPACE/.hxcpp-config.xml"
        CONFIG="${CONFIG//\\//}"
        awk -v cache="$CACHE_DIR" '/<section id="vars">/ { print; printf "  <set name=\"HXCPP_COMPILE_CACHE\" value=\"%s\" />\n", cache; print "  <set name=\"HXCPP_CACHE_MB\" value=\"4000\" />"; next } 1' "$EXAMPLE" > "$CONFIG"
        echo "HXCPP_CONFIG=$CONFIG" >> "$GITHUB_ENV"
        echo "hxcpp compile cache: $CACHE_DIR"

    - name: Init discord_rpc submodules
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE/.haxelib/discord_rpc/git"
        git submodule update --init --recursive

    - name: Patch hxcpp zlib for modern macOS SDK
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
        ! grep -rq 'define fdopen(fd,mode) NULL' "$GITHUB_WORKSPACE/.haxelib/hxcpp"

    - name: Silence unused -stdlib=libc++ warning on macOS
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/toolchain/mac-toolchain.xml' \
          -exec perl -0pi -e 's{(<flag value="-stdlib=libc\+\+" unless="STDLIBCPP" />)}{$1\n  <flag value="-Wno-unused-command-line-argument" if="HXCPP_CLANG" />}' {} +
        find "$GITHUB_WORKSPACE/.haxelib/hxcpp" -path '*/toolchain/mac-toolchain.xml' -exec grep -q 'Wno-unused-command-line-argument' {} \;

    - name: Read app version
      shell: bash
      run: |
        echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

    - name: Rebuild Lime ndll (SDL3)
      shell: bash
      run: ${{ inputs.rebuild }}

    - name: Compile
      shell: bash
      run: ${{ inputs.build }}

    - name: Collect crash symbols
      shell: bash
      # Windows already ships a matching symbol bundle from
      # tools/build_windows_symbols.ps1 (embedded crash linemap + .map +
      # build-info.txt). This step only fills the gap for the targets that have
      # none yet: it copies the linker .map, which maps every function's exact
      # RVA so a report's "Fault offset" still resolves offline.
      # The .map is a separate download - never inside the game package - and a
      # PDB is never published.
      run: |
        set -euo pipefail
        TARGET="${{ inputs.target }}"
        case "$TARGET" in
          windows) OUT="export/release/windows" ;;
          linux)   OUT="export/release/linux" ;;
          *)       OUT="export/release/macos" ;;
        esac

        mkdir -p "$OUT/symbols"
        found=0
        # Only the .map: with HXCPP_DEBUG_LINK off the linker never runs /DEBUG,
        # so no PDB is regenerated and whatever .pdb sits in obj/ belongs to some
        # older build. Shipping it would actively mislead - resolve against the map.
        for f in "$OUT"/obj/ApplicationMain.map; do
          if [ -e "$f" ]; then
            cp -R "$f" "$OUT/symbols/"
            found=1
            echo "collected: $f"
          fi
        done

        if [ "$found" -eq 0 ]; then
          echo "::warning::No symbol files found for $TARGET - crash reports will not be symbolizable"
          exit 0
        fi

        # Shim so `python tools/mapresolve.py <map> <offset>` works with the
        # published layout (the CI collector is named after the target).
        if [ -f "$OUT/symbols/ApplicationMain.map" ]; then
          cat > "$OUT/symbols/README.txt" <<'EOF'
        SeiunEngine crash symbol files
        ==============================

        These files map a crash report's "Fault offset" back to a real function.

        Windows builds additionally ship windows-x64.bin (the crash linemap that is
        embedded in the published exe) and build-info.txt - see
        tools/build_windows_symbols.ps1. With those, the backtrace inside the report
        already carries cpp file:line, and the .map below is only a fallback.

        How to use
        ----------
        1. Get crash/native_crash_*.txt from the affected user.
        2. Confirm the report is from THIS build: its "Main module stamp:
           TimeDateStamp=0x..." line must match the TimeDateStamp of the exe these
           symbols were produced with. Symbols only resolve against their own build.
        3. Resolve the offsets (the report may contain several, from the backtrace):

             python tools/mapresolve.py ApplicationMain.map 0x1340289 0x133429A

           or point it straight at a crash directory:

             python tools/mapresolve.py --crash-dir <crash dir> ApplicationMain.map

        4. Read the nearest preceding function and the +0x offset. Frames whose
           offset is implausibly large (hundreds of KB) are not reliable: release
           builds do not list every function in the map.

        The native "Symbols:" line in the report refers to dbghelp pairing the exe
        with a PDB; release builds do not ship one, so it says SymType=0. That is
        expected and no longer matters: the [file:line] annotations come from the
        embedded linemap. Use the .map only for frames the linemap does not cover.

        A real .pdb is intentionally NEVER published (it is ~50 MB). The linemap is
        generated from a PDB during the build (tools/build_windows_symbols.ps1,
        tools/gen_linemap_msvc.py) and that PDB stays in obj/ - the published exe
        carries the compressed address->line table instead.
        EOF
          echo "wrote $OUT/symbols/README.txt"
        fi

        du -sh "$OUT/symbols" || true
        ls -la "$OUT/symbols"

    - name: Ad-hoc codesign macOS app
      if: startsWith(inputs.target, 'macos')
      shell: bash
      run: |
        # lime produces an unsigned .app; macOS (especially Apple Silicon)
        # refuses to run unsigned/mis-signed bundles ("damaged" / killed).
        # Ad-hoc signing makes the app launchable (right-click -> Open on the
        # first run). Real Developer ID + notarization would need Apple certs.
        APP="$(find export/release/macos/bin -maxdepth 2 -name '*.app' | head -n1)"
        if [ -n "$APP" ]; then
          echo "Signing: $APP"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict -v "$APP"
          echo "Ad-hoc signing OK"
        else
          echo "::warning::No .app bundle found in export/release/macos/bin - skipping codesign"
        fi
