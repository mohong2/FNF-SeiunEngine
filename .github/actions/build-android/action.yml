name: Build Android Target
description: Build the Android game for a single ABI (shared pipeline steps).

inputs:
  abi:
    description: 'ABI id used in artifact names: arm64 or armv7'
    required: true
  arch:
    description: 'Lime architecture flag, e.g. -arm64 or -armv7'
    required: true

runs:
  using: composite
  steps:
    # See build-desktop/action.yml: the haxelib dependencies are all public, so
    # there is no auth step any more (a stale PAT only produced a warning).

    - name: Install Android SDK components
      shell: pwsh
      run: |
        $SDKMANAGER = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
        1..20 | ForEach-Object { "y" } | & $SDKMANAGER --licenses 2>$null | Out-Null
        & $SDKMANAGER "platforms;android-33" "build-tools;34.0.0" "platform-tools" "ndk;21.4.7075529"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK=$env:ANDROID_HOME"
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\21.4.7075529"
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SETUP=true"

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "11"

    - name: Install haxelib dependencies
      shell: pwsh
      run: |
        haxelib setup "$env:GITHUB_WORKSPACE\.haxelib"
        haxe -cp ./setup -main Main --interp

    # Resolve the active library directories once, so no step below hardcodes
    # .haxelib/<lib>/git - renaming the version directory must not break the build.
    - name: Resolve haxelib paths
      uses: ./.github/actions/haxelib-path
      with:
        libs: hxcpp lime discord_rpc

    # A wrong fork revision is invisible to the Haxe build and only explodes in C++, so
    # every lane checks the installed forks before it compiles anything.
    - name: Verify forked libraries
      uses: ./.github/actions/verify-forks

    - name: Enable hxcpp compile cache
      shell: pwsh
      run: |
        Remove-Item "$env:USERPROFILE\.hxcpp_config.xml", "$env:USERPROFILE\.lime\config.xml" -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.lime" | Out-Null
        @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<config>'
          '  <section id="defines">'
          '  </section>'
          '</config>'
        ) | Set-Content "$env:USERPROFILE\.lime\config.xml" -Encoding UTF8
        $cacheDir = "$env:GITHUB_WORKSPACE\.hxcpp-cache"
        $cacheDir = $cacheDir -replace '\\','/'
        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
        # A restored precompiled header cannot be trusted: clang bakes every header's
        # mtime into the .pch, a fresh checkout stamps those headers with today's time,
        # and hxcpp only compares the group header's hash before reusing one - so the
        # first file that has to be compiled dies with
        #   file '...\include\hx\LessThanEq.h' has been modified since the
        #   precompiled header '...\hxcpp.h.pch' was built
        # src/BuildInfo.cpp is always newest (it carries the run id), so this hits the
        # very first group of every run. Dropping the pch* directories costs a couple of
        # seconds per group and leaves the object cache itself alone.
        Get-ChildItem -Path $cacheDir -Directory -Recurse -Filter 'pch*' -ErrorAction SilentlyContinue |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Write-Output "dropped cached precompiled headers"
        $example = "$env:HAXELIB_HXCPP_PATH/toolchain/example.hxcpp_config.xml"
        $example = $example -replace '\\','/'
        # Keep the config OUT of the workspace root (see build-desktop/action.yml): a stray xml
        # next to Project.xml can hijack lime's project auto-detection.
        $config = "$env:RUNNER_TEMP\.hxcpp-config.xml"
        $config = $config -replace '\\','/'
        $content = Get-Content -Raw $example
        $content = $content -replace '(?s)(<section id="vars">)', "`$1`n  <set name=""HXCPP_COMPILE_CACHE"" value=""$cacheDir"" />`n  <set name=""HXCPP_CACHE_MB"" value=""4000"" />"
        [System.IO.File]::WriteAllText($config, $content, [System.Text.UTF8Encoding]::new($false))
        Add-Content -Path $env:GITHUB_ENV -Value "HXCPP_CONFIG=$config"
        Write-Output "hxcpp compile cache: $cacheDir"

    - name: Configure Android SDK
      shell: pwsh
      run: |
        "$env:ANDROID_SDK`n$env:ANDROID_NDK_ROOT`n$env:JAVA_HOME" | haxelib run lime setup android

    - name: Init discord_rpc submodules
      shell: pwsh
      run: |
        cd "$env:HAXELIB_DISCORD_RPC_PATH"
        git submodule update --init --recursive

    - name: Apply Android template patches
      shell: pwsh
      run: |
        $LT = "$env:HAXELIB_LIME_PATH/templates/android/template"
        New-Item -ItemType Directory -Force -Path "$LT/app/src/main/java/org/haxe/extension", "$LT/app/src/main/res/drawable" | Out-Null
        Copy-Item "templates/android/java/org/haxe/extension/SeiunOverlay.java" "$LT/app/src/main/java/org/haxe/extension/SeiunOverlay.java" -Force
        Copy-Item "templates/android/template/app/src/main/res/drawable/seiun_ic_keyboard.xml" "$LT/app/src/main/res/drawable/seiun_ic_keyboard.xml" -Force
        Copy-Item "templates/android/template/app/src/main/AndroidManifest.xml" "$LT/app/src/main/AndroidManifest.xml" -Force

    - name: Read app version
      shell: pwsh
      run: |
        # Accept version suffixes (0.2.2preonline1): the old digits-and-dots-only pattern
        # matched nothing and shipped empty names such as "SeiunEngine-android-arm64-.apk".
        $xml = Get-Content -Raw Project.xml
        $v = [regex]::Match($xml, '<app[^>]*\sversion="([0-9][0-9A-Za-z._-]*)"').Groups[1].Value
        if (-not $v) {
          Write-Error 'Could not read <app ... version="..."> from Project.xml'
          exit 1
        }
        Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"
        Write-Output "app version: $v"

    - name: Rebuild Lime Android ndll (SDL3)
      shell: pwsh
      run: haxelib run lime rebuild android ${{ inputs.arch }} -release -Dlime-sdl3 -Dhxcpp_api_level=430

    # One plain lime build per ABI. Project.xml keeps HXCPP_DEBUG_LINK_AND_STRIP on
    # release android builds, so hxcpp saves the unstripped libApplicationMain.so
    # before stripping the one that goes into the APK; the <postbuild> hook
    # (tools/SymbolsAfterBuild.hx) then moves it into export/symbols/android-release/
    # with build.json + build-info.txt. The release workflow publishes that directory
    # inside the single SeiunEngine-symbols-<version>.zip.
    # Same reason as the desktop Compile step: an hxcpp error can leave the process
    # hanging instead of exiting. Composite steps cannot carry timeout-minutes, so the
    # bound is on the job.
    - name: Build APK
      shell: pwsh
      env:
        _JAVA_OPTIONS: "-Xmx5g -XX:MaxMetaspaceSize=1g"
      run: |
        haxelib run lime build "$env:GITHUB_WORKSPACE\Project.xml" android ${{ inputs.arch }} --app-version="$env:APP_VERSION-${{ github.run_id }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Check crash symbols
      shell: pwsh
      # The unstripped .so is the only thing that turns this APK's addresses into
      # file:line, so a build that lost it is not publishable.
      run: |
        $dir = 'export/symbols/android-release'
        if (-not (Test-Path (Join-Path $dir 'build.json'))) {
          Write-Error "$dir\build.json is missing - the symbol hook (tools/SymbolsAfterBuild.hx) did not run"
          exit 1
        }
        Get-Content (Join-Path $dir 'build-info.txt')
        $so = Get-ChildItem $dir -Filter 'libApplicationMain*.so' -ErrorAction SilentlyContinue
        if (-not $so) {
          Write-Error "$dir holds no unstripped libApplicationMain*.so - a report from this APK could not be resolved"
          exit 1
        }
        $so | Select-Object Name, Length | Format-Table -AutoSize | Out-String
        Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String

    - name: Prepare APK artifact
      shell: pwsh
      run: |
        $apk = Get-ChildItem "export/release/android/bin/app/build/outputs/apk/release/*.apk" | Select-Object -First 1
        if (-not $apk) {
          Write-Error "No APK found under export/release/android/bin/app/build/outputs/apk/release/"
          exit 1
        }
        Copy-Item $apk.FullName "SeiunEngine-android-${{ inputs.abi }}-$env:APP_VERSION.apk" -Force
        Get-Item "SeiunEngine-android-${{ inputs.abi }}-$env:APP_VERSION.apk" | Select-Object Name, Length

    # The gradle cache is saved by a post-job step of actions/cache, and that step
    # tars ~/.gradle/caches while the Gradle daemon still holds the *.lock files
    # open. tar then dies with
    #   Read error at byte 0 ... Device or resource busy
    #   tar: Exiting with failure status due to previous errors
    # the post step fails with exit code 2, and the whole cache entry is lost -
    # which is why every Android job reported a save failure and every job after
    # it downloaded nothing. Stopping the daemons first releases the handles; by
    # now the APK is built and copied, so nothing needs a JVM any more.
    - name: Stop the Gradle daemon
      if: always()
      shell: pwsh
      # Releasing a lock is best effort: a job must not turn red over cache hygiene.
      continue-on-error: true
      run: |
        $appDir = 'export/release/android/bin/app'
        if (Test-Path (Join-Path $appDir 'gradlew.bat')) {
          Push-Location $appDir
          try { cmd /c 'gradlew.bat --stop' } finally { Pop-Location }
        }
        # --stop only shuts down the daemons that registered themselves; the JVM that
        # gradle forked for the build (and any Kotlin daemon) can outlive it.
        Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 3
        if (Get-Process java -ErrorAction SilentlyContinue) {
          Write-Output '::warning::a java process is still alive - the gradle cache save may still fail'
        } else {
          Write-Output 'gradle daemons stopped; the gradle cache save can read its lock files'
        }
        exit 0
