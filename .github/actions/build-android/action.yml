name: Build Android Target
description: Build the Android game for a single ABI (shared pipeline steps).

inputs:
  abi:
    description: 'ABI id used in artifact names: arm64 or armv7'
    required: true
  arch:
    description: 'Lime architecture flag, e.g. -arm64 or -armv7'
    required: true
  gh-pat:
    description: 'Optional GitHub PAT for private haxelib dependencies'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # See build-desktop: public haxelib deps need no auth, and a bad token must never fail the
    # job (it is dropped again so it cannot break the public clones).
    - name: Auth private haxelib deps
      shell: pwsh
      env:
        GH_PAT: ${{ inputs.gh-pat }}
      run: |
        $GH_PAT = $env:GH_PAT -replace "[\r\n]", ""
        if (-not $GH_PAT) {
          Write-Output 'No GH_PAT: haxelib dependencies are public, continuing without auth.'
          exit 0
        }
        $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$GH_PAT"))
        git config --local --unset-all http.https://github.com/.extraheader 2>$null
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
        # The probe must not be able to prompt, and a non-zero exit must not abort the step
        # (pwsh 7.4 can turn a failed native command into a terminating error).
        $prevEAP = $ErrorActionPreference
        $ErrorActionPreference = 'Continue'
        $env:GIT_TERMINAL_PROMPT = '0'
        git ls-remote https://github.com/mohong2/flixel.git HEAD *> $null
        $probeOk = ($LASTEXITCODE -eq 0)
        $ErrorActionPreference = $prevEAP
        if ($probeOk) {
          Write-Output 'git auth configured (GH_PAT works)'
        } else {
          git config --global --unset-all http.https://github.com/.extraheader 2>$null
          Write-Output '::warning::GH_PAT did not authenticate; dropped it and continuing (public deps need no auth).'
        }
        exit 0

    - name: Install Android SDK components
      shell: pwsh
      run: |
        $SDKMANAGER = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
        1..20 | ForEach-Object { "y" } | & $SDKMANAGER --licenses 2>$null | Out-Null
        & $SDKMANAGER "platforms;android-33" "build-tools;34.0.0" "platform-tools" "ndk;21.4.7075529"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK=$env:ANDROID_HOME"
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\21.4.7075529"
        Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SETUP=true"

    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "11"

    - name: Install haxelib dependencies
      shell: pwsh
      run: |
        haxelib setup "$env:GITHUB_WORKSPACE\.haxelib"
        haxe -cp ./setup -main Main --interp

    # Resolve the active library directories once, so no step below hardcodes
    # .haxelib/<lib>/git - renaming the version directory must not break the build.
    - name: Resolve haxelib paths
      uses: ./.github/actions/haxelib-path
      with:
        libs: hxcpp lime discord_rpc

    - name: Enable hxcpp compile cache
      shell: pwsh
      run: |
        Remove-Item "$env:USERPROFILE\.hxcpp_config.xml", "$env:USERPROFILE\.lime\config.xml" -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.lime" | Out-Null
        @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<config>'
          '  <section id="defines">'
          '  </section>'
          '</config>'
        ) | Set-Content "$env:USERPROFILE\.lime\config.xml" -Encoding UTF8
        $cacheDir = "$env:GITHUB_WORKSPACE\.hxcpp-cache"
        $cacheDir = $cacheDir -replace '\\','/'
        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
        $example = "$env:HAXELIB_HXCPP_PATH/toolchain/example.hxcpp_config.xml"
        $example = $example -replace '\\','/'
        # Keep the config OUT of the workspace root (see build-desktop/action.yml): a stray xml
        # next to Project.xml can hijack lime's project auto-detection.
        $config = "$env:RUNNER_TEMP\.hxcpp-config.xml"
        $config = $config -replace '\\','/'
        $content = Get-Content -Raw $example
        $content = $content -replace '(?s)(<section id="vars">)', "`$1`n  <set name=""HXCPP_COMPILE_CACHE"" value=""$cacheDir"" />`n  <set name=""HXCPP_CACHE_MB"" value=""4000"" />"
        [System.IO.File]::WriteAllText($config, $content, [System.Text.UTF8Encoding]::new($false))
        Add-Content -Path $env:GITHUB_ENV -Value "HXCPP_CONFIG=$config"
        Write-Output "hxcpp compile cache: $cacheDir"

    - name: Configure Android SDK
      shell: pwsh
      run: |
        "$env:ANDROID_SDK`n$env:ANDROID_NDK_ROOT`n$env:JAVA_HOME" | haxelib run lime setup android

    - name: Init discord_rpc submodules
      shell: pwsh
      run: |
        cd "$env:HAXELIB_DISCORD_RPC_PATH"
        git submodule update --init --recursive

    - name: Apply Android template patches
      shell: pwsh
      run: |
        $LT = "$env:HAXELIB_LIME_PATH/templates/android/template"
        New-Item -ItemType Directory -Force -Path "$LT/app/src/main/java/org/haxe/extension", "$LT/app/src/main/res/drawable" | Out-Null
        Copy-Item "templates/android/java/org/haxe/extension/SeiunOverlay.java" "$LT/app/src/main/java/org/haxe/extension/SeiunOverlay.java" -Force
        Copy-Item "templates/android/template/app/src/main/res/drawable/seiun_ic_keyboard.xml" "$LT/app/src/main/res/drawable/seiun_ic_keyboard.xml" -Force
        Copy-Item "templates/android/template/app/src/main/AndroidManifest.xml" "$LT/app/src/main/AndroidManifest.xml" -Force

    - name: Read app version
      shell: pwsh
      run: |
        # Accept version suffixes (0.2.2preonline1): the old digits-and-dots-only pattern
        # matched nothing and shipped empty names such as "SeiunEngine-android-arm64-.apk".
        $xml = Get-Content -Raw Project.xml
        $v = [regex]::Match($xml, '<app[^>]*\sversion="([0-9][0-9A-Za-z._-]*)"').Groups[1].Value
        if (-not $v) {
          Write-Error 'Could not read <app ... version="..."> from Project.xml'
          exit 1
        }
        Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"
        Write-Output "app version: $v"

    - name: Rebuild Lime Android ndll (SDL3)
      shell: pwsh
      run: haxelib run lime rebuild android ${{ inputs.arch }} -release -Dlime-sdl3 -Dhxcpp_api_level=430

    # Two lime builds plus the linemap generation, driven by one script: the
    # .bin files only exist after the first build, so the second one embeds them
    # (the linemap is a resident Project.xml asset now). The script also verifies the embedded table against the
    # .so it was built from and stages export/release/android/symbols, which the
    # release workflow publishes as SeiunEngine-android-<abi>-symbols.
    - name: Build APK with matching crash symbols
      shell: pwsh
      env:
        _JAVA_OPTIONS: "-Xmx5g -XX:MaxMetaspaceSize=1g"
      run: >
        powershell -ExecutionPolicy Bypass -File tools\build_android_symbols.ps1
        -Arch "${{ inputs.arch }}" -AppVersion "$env:APP_VERSION-${{ github.run_id }}"

    - name: Prepare APK artifact
      shell: pwsh
      run: |
        $apk = Get-ChildItem "export/release/android/bin/app/build/outputs/apk/release/*.apk" | Select-Object -First 1
        if (-not $apk) {
          Write-Error "No APK found under export/release/android/bin/app/build/outputs/apk/release/"
          exit 1
        }
        Copy-Item $apk.FullName "SeiunEngine-android-${{ inputs.abi }}-$env:APP_VERSION.apk" -Force
        Get-Item "SeiunEngine-android-${{ inputs.abi }}-$env:APP_VERSION.apk" | Select-Object Name, Length
